const KEYS='runknife_v2_20261104', OLD='runknife_studio_save_v1';
const mkSave=()=>({runs:0,wins:0,profit:0,found:{},redSeen:{},ach:[],redWins:0,rescueWins:0,winFlags:{}});
const redBook=DATA.goods.filter(g=>g.grade==='red');
const redBookIds=new Set(redBook.map(g=>g.id));
const isRedBook=g=>redBookIds.has(g.id);
let save=mkSave();try{const x=JSON.parse(localStorage.getItem(KEYS));if(x)save={...mkSave(),...x};else{const o=JSON.parse(localStorage.getItem(OLD));if(o){save.runs=Number(o.runs)||0;save.wins=Number(o.extractions)||0;save.profit=Number(o.profit)||0;}}}catch(e){}
for(const [id,count] of Object.entries(save.found||{})){if(redBookIds.has(id))save.redSeen[id]=Math.max(save.redSeen[id]||0,count||0)}
const store=()=>{try{localStorage.setItem(KEYS,JSON.stringify(save))}catch(e){}};

function weightedEncounter(pool){let total=pool.reduce((v,e)=>v+(e.weight||1),0),r=Math.random()*total;for(const e of pool){r-=e.weight||1;if(r<=0)return e}return pool[pool.length-1]}
function encounterCandidates(){let pool=ENCOUNTER_POOL.filter(e=>(!e.maps||e.maps.includes(map.id))&&(!e.ops||e.ops.includes(char.id))&&(!e.requires||run.flags[e.requires])&&!run.seen.includes(e.id));if(!pool.length){run.seen=[];pool=ENCOUNTER_POOL.filter(e=>(!e.maps||e.maps.includes(map.id))&&(!e.ops||e.ops.includes(char.id))&&(!e.requires||run.flags[e.requires]));}return pool}
function nextEncounter(){

// Container-weighted simulator rates, calibrated against an equal-container reference mix.
const BASECON=DATA.containers;
function eligible(g,c){return c.categories.includes(g.lootCategory)&&(g.grade!=='red'||(g.lootable&&(!g.allowedMaps||g.allowedMaps.includes(map.id))))}
const WEIGHTS={red:c=>c.weight,rare:c=>c.weight*(c.categories.includes('工艺藏品')?1:0)};
const sumWeight=(fn)=>BASECON.reduce((s,c)=>s+fn(c),0)/BASECON.length;
const REDAVG=()=>sumWeight(c=>c.weight*(DATA.goods.some(g=>g.grade==='red'&&g.id!=='heart'&&g.id!=='ocean'&&eligible(g,c))?1:0));
const RAREAVG=sumWeight(c=>c.weight*(c.categories.includes('工艺藏品')?1:0));
function rates(c){
 const hasRed=DATA.goods.some(g=>g.grade==='red'&&g.id!=='heart'&&g.id!=='ocean'&&eligible(g,c));
 const rare=c.categories.includes('工艺藏品');
 return {heart:rare?DATA.lootRules.heart*c.weight/RAREAVG:0,ocean:0,other:hasRed?DATA.lootRules.otherRed*c.weight/REDAVG():0};
}
function pickWeighted(items){const weights={white:46,green:32,blue:15,purple:5.5,gold:1.5};let total=0;for(const g of items)total+=weights[g.grade]||1;let r=Math.random()*total;for(const g of items){r-=weights[g.grade]||1;if(r<=0)return g}return items[items.length-1]}
function randItem(c){
 const pool=DATA.goods.filter(g=>eligible(g,c));const non=pool.filter(g=>g.grade!=='red');
 const rate=rates(c),r=Math.random();
 if(r<rate.heart)return DATA.goods.find(g=>g.id==='heart');
 const red=pool.filter(g=>g.grade==='red'&&g.id!=='heart'&&g.id!=='ocean');
 if(red.length&&r<rate.heart+rate.ocean+rate.other)return pick(red);
 return non.length?pickWeighted(non):(pool.length?pick(pool):pick(DATA.goods.filter(g=>g.grade!=='red')));
}
function currentLocation(){return (DATA.mapLocations[map.id]||[]).find(x=>x.id===run.locationId)}
function candidateContainers(kind){const here=currentLocation();let pool=(here?here.containers.map(id=>BASECON.find(c=>c.id===id)).filter(Boolean):[]);if(kind==='medical')pool=pool.filter(c=>c.categories.includes('医疗道具'));return pool.filter(c=>c.id!=='safe'&&!run.searchedKeys.includes(run.locationId+":"+c.id))}
function gridShape(i){const patterns=[[0,1,4,5],[2,3,6,7],[8,9,12,13],[10,11,14,15],[0,4,8,12],[3,7,11,15]];return patterns[i%patterns.length]}

function loot(kind,containerId){
 const forcedVault=kind==='mandatory-vault'&&containerId==='safe';
 if(!forcedVault&&run.stageSearches>=run.searchLimit)return null;
 const c=forcedVault?BASECON.find(x=>x.id==='safe'):candidateContainers(kind).find(x=>x.id===containerId);if(!c)return null;
 if(forcedVault&&run.vaultOpened)return null;

 if(run.searchedKeys.includes(key))return null;run.searchedKeys.push(key);
 if(forcedVault){run.vaultOpened=true;run.logs.push('必经搜索：开启大保险柜（每局唯一一次）');}
 else run.stageSearches++;run.lastContainerNode=run.idx;
 const results=[];const items=[];
 for(let i=0;i<c.draws;i++){const item=randItem(c);items.push(item);results.push(takeItem(item,c.name))}

}

 run.risk=Math.min(90,run.risk+6);const got=Math.random()<DATA.lootRules.specialOceanBox;const reward=got?DATA.goods.find(g=>g.id==='ocean'):pickWeighted(DATA.goods.filter(g=>g.grade!=='red'&&['工具材料','电子物品','医疗道具'].includes(g.lootCategory)));

function processChoice(i){if(!run||run.ended)return;const e=run.current,c=e.choices[i],type=c[1];run.risk+=c[2];run.logs.push(`${e.title} → ${c[0]}`);if(e.sets)e.sets.forEach(x=>run.flags[x]=true);let outcome=resolveEncounter(type);if(type==='exit')return;if(Math.random()<Math.max(.015,run.risk/360)){run.hp=Math.max(1,run.hp-7-Math.floor(Math.random()*15));outcome+=' 途中你还遭到零星压制。'}pushOutcome(outcome);run.idx++;run.stageSearches=0;run.searchLimit=2+Math.floor(Math.random()*2);if(run.idx>=run.steps){extract();return}run.current=nextEncounter();if(!randomNextLocation())scene()}
function banner(){return `<div class="stats"><div class="stat"><span>生命</span><b class="${run.hp<40?'red':''}">${run.hp}%</b></div><div class="stat"><span>警戒风险</span><b class="${run.risk>55?'red':''}">${run.risk}</b></div><div class="stat"><span>背包</span><b>${used()}/18</b></div></div><div class="meter"><i style="width:${used()/18*100}%"></i></div>`}
function scene(){if(run&&!run.vaultOpened&&run.idx>=run.vaultAt){mandatoryVaultGate('resume');return}page='scene';const e=run.current;view.innerHTML=`<div class="eyebrow">${map.name.toUpperCase()} // 第 ${run.idx+1} / ${run.steps} 段</div><h1>${e.title}</h1><div class="location-status">📍 <b>${currentLocation()?.name||"未知区域"}</b><div class="small">本局随机路线 · 已经过 ${run.visited.length} 个区域（按模拟相邻区域推进）</div></div>${banner()}${run.outcome?`<div class="outcome-box"><span class="eyebrow">刚才发生</span><p>${run.outcome}</p></div>`:''}${run.lastLoot?`<div class="card"><h3>最近搜刮：${run.lastLoot.container}</h3>${run.lastLoot.items.map(x=>`<div class="small">▸ ${x}</div>`).join('')}</div>`:''}<div class="card"><div class="eyebrow">搜索是本局主线 · 已搜索 ${run.searches} 件物资</div><p class="small">先搜索附近容器，摸完再决定事件分支；危险事件只是跑刀途中的插曲。</p><button class="btn primary" id="quickSearch" ${run.stageSearches>=run.searchLimit||!candidateContainers().length?'disabled':''}>🔎 搜索附近容器（${run.stageSearches}/${run.searchLimit}）</button></div><div class="card"><span class="pill">${e.tag}</span><span class="pill">${char.name}</span><div class="story">${e.desc}</div>${e.choices.map((c,i)=>`<button class="option" data-opt="${i}"><b>${i+1}. ${c[0]}</b><small>${c[3]} · ${c[2]>0?'风险增加':'风险较低'}</small></button>`).join('')}</div><div class="card"><div class="headbar"><h3>背包物资</h3><span class="small">估值 ${N(total())}</span></div>${run.bag.length?itemsTable(run.bag):'<p class="small">尚未获得物资。</p>'}</div><div class="double"><button class="btn primary" id="searchContainer" ${run.stageSearches>=run.searchLimit||!candidateContainers().length?'disabled':''}>${run.stageSearches>=run.searchLimit?'本阶段搜刮完成':'搜索附近容器 · '+run.stageSearches+'/'+run.searchLimit}</button><button class="btn" id="extractEarly">尝试提前撤离 →</button></div>`;view.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>processChoice(+b.dataset.opt));$('extractEarly').onclick=extract;$('searchContainer').onclick=()=>containerView();$('quickSearch').onclick=()=>containerView()}
function extract(){if(run&&!run.vaultOpened){mandatoryVaultGate('extract');return}page='extract';view.innerHTML=`<div class="eyebrow">EXTRACTION DECISION</div><h1>最后的撤离抉择</h1>${banner()}<div class="card"><p>剩余生命 ${run.hp}%，背包估值 ${N(total())} 模拟哈夫币。撤离路线有固定、条件、特殊等多种类型；本原型只抽象风险，不模拟某个真实点位的具体开启条件。</p><button class="option" id="quiet"><b>保持静默，谨慎撤离</b><small>基础风险 -13；蜂医与蝶偏向这条路线</small></button><button class="option" id="fast"><b>快速突围，抢时间撤离</b><small>基础风险 +12；红狼获得机动优势</small></button></div>`;$('quiet').onclick=()=>finish(false);$('fast').onclick=()=>finish(true)}
function unlock(cond,id){if(cond&&!save.ach.includes(id))save.ach.push(id)}
function finish(fast){if(!run||run.ended)return;if(!run.vaultOpened){mandatoryVaultGate('extract');return}run.ended=true;run.lastFast=fast;let danger=run.risk+(fast?12:-13)+(100-run.hp)*.16-(fast&&char.id==='wolf'?19:0)-(!fast&&char.id==='medic'?7:0);danger=Math.min(92,Math.max(6,danger));let ok=!roll(danger/100);let reds=run.bag.filter(isRed);let gain=ok?total():0;let ending='撤离失败 · 暂时失联';if(ok){if(reds.length>=2)ending='满载归航 · 红运当头';else if(run.hp<=40)ending='惊险生还 · 极限返航';else if(run.flags.foundair)ending='露天捡漏 · 红光不骗人';else if(run.flags.bossloot)ending='残局捡漏 · 猛攻哥的遗产';else if(run.flags.ratmet)ending='鼠鼠江湖 · 和平归来';else if(char.id==='wolf'&&fast)ending='极速突围 · 红狼时刻';else ending='稳健撤离 · 平安归来';save.wins++;save.profit+=gain;if(reds.length)save.redWins++;if(run.rescues)save.rescueWins++;for(const g of run.bag)save.found[g.id]=(save.found[g.id]||0)+1;save.winFlags[char.id+'Win']=true;save.winFlags[map.id+'Win']=true;if(run.rescues)save.winFlags[char.id+'Rescue']=true;}
unlock(ok&&save.wins>=1,'first');unlock(save.runs>=10,'ten');unlock(ok&&run.hp<=40,'survivor');unlock(save.redWins>=1,'red');unlock(ok&&reds.length>=2,'triple');unlock(ok&&char.id==='wolf','wolf');unlock(ok&&char.id==='medic','medic');unlock(ok&&char.id==='butterfly','butterfly');unlock(ok&&map.id==='dam','dam');unlock(ok&&map.id==='az3','az3');unlock(ok&&map.id==='space','space');unlock(ok&&run.searches<=1,'minimal');unlock(ok&&gain>=10000000,'big');unlock(DATA.goods.filter(g=>g.grade==='red'&&save.found[g.id]>0).length>=8,'collector');unlock(ok&&run.flags.ratmet,'altruist');store();page='result';view.innerHTML=`<div class="eyebrow">AFTER ACTION REPORT</div><h1 class="${ok?'good':'red'}">${ending}</h1><div class="card"><div class="small">本局实际带出收益</div><div class="big ${ok?'gold':'red'}">${N(gain)}</div><div class="small">模拟哈夫币 · ${ok?'已保存到图鉴':'未成功带出物资'} · 本局警戒 ${Math.round(danger)}%</div><hr class="divider"><h3>本局搜得物品 (${run.bag.length})</h3>${run.bag.length?itemsTable(run.bag):'<p class="small">本局没有物资</p>'}</div><div class="card"><h3>行动日志</h3>${run.logs.map(x=>`<p class="small zero">▸ ${x}</p>`).join('')||'<p class="small">没有行动记录</p>'}</div><div class="double"><button class="btn primary" id="again">再来一局</button><button class="btn" id="collect">图鉴 / 成就</button></div>`;$('again').onclick=start;$('collect').onclick=()=>gallery('loot')}
function gallery(tab='loot', filter='all', query=''){
 page='gallery'; const all=DATA.goods, red=redBook, known=all.filter(g=>save.found[g.id]>0);
 view.innerHTML=`<div class="eyebrow">FIELD ARCHIVE // ${DATA.version}</div><h1>物资图鉴与行动档案</h1><p class="small">红色收藏品名单以你上传的 Excel 为准；其他普通物资仍沿用原游戏数据库。容器分类参考公开玩家资料，概率、估值和占格仅供模拟。累计解锁 ${known.length}/${all.length} 种。</p><div class="tabs"><button id="tab-reds" class="${tab==='reds'?'active':''}">◆ 大红收藏 ${red.filter(g=>(save.redSeen[g.id]||0)>0||(save.found[g.id]||0)>0).length}/${red.length}</button><button id="tab-loot" class="${tab==='loot'?'active':''}">全部物资 ${all.length}</button><button id="tab-ach" class="${tab==='ach'?'active':''}">成就 ${save.ach.length}/${DATA.achievements.length}</button><button id="tab-data" class="${tab==='data'?'active':''}">爆率与来源</button></div><div class="card" id="archive"></div><button class="btn" id="return">返回主菜单</button>`;
 if(tab==='reds'){
 const owned=g=>(save.redSeen[g.id]||0)>0||(save.found[g.id]||0)>0;
 const seen=red.filter(owned).length;
 const extracted=red.filter(g=>(save.found[g.id]||0)>0).length;
 $('archive').innerHTML=`<div class="eyebrow">RED LOOT COLLECTION</div><h3>大红收集图鉴</h3><div class="red-progress"><div>已摸出 <span class="big">${seen}/${red.length}</span>　<span class="small">成功带出 ${extracted} 种</span></div><div class="red-track"><i style="width:${(seen/red.length*100).toFixed(1)}%"></i></div></div><p class="small">图鉴严格按上传的红色收集品清单制作，不加入金色或其他特殊物资。活动/其他地图限定物资保留展示，但在当前地图普通搜索中不会随机掉落。曾经摸出即解锁图鉴；成功撤离才计入带出次数。失败撤离、背包放不下也保留摸出记录。本机浏览器本地保存，清除网站数据可能丢失。</p><div class="red-filters"><button data-rf="all" class="on">全部 ${red.length}</button><button data-rf="owned">已收集 ${seen}</button><button data-rf="locked">未收集 ${red.length-seen}</button></div><div id="red-cards" class="red-grid"></div>`;
 const iconFor=g=>g.lootCategory==='工艺藏品'?'◆':g.lootCategory==='医疗道具'?'✚':g.lootCategory==='电子物品'?'▣':g.lootCategory==='能源燃料'?'⚡':'⬡';
 const draw=(f='all')=>{let list=red.filter(g=>f==='all'||(f==='owned'?owned(g):!owned(g)));$('red-cards').innerHTML=list.map(g=>`<div class="red-card ${owned(g)?'':'locked'}"><div class="red-symbol">${owned(g)?iconFor(g):'🔒'}</div><b>${g.name}</b><small>${owned(g)?'✓ 已收集':'◇ 未收集'} · ${g.tier||'红色'}${g.limited?' · 炫彩':''}</small><small>${g.lootable?'当前地图可搜索':'限定来源／暂不可在普通搜索获得'}</small><small>摸出 ${(save.redSeen[g.id]||save.found[g.id]||0)} 次 · 成功带出 ${save.found[g.id]||0} 次</small></div>`).join('')||'<p class="small">当前分类暂无记录</p>';view.querySelectorAll('[data-rf]').forEach(b=>b.classList.toggle('on',b.dataset.rf===f))};
 view.querySelectorAll('[data-rf]').forEach(b=>b.onclick=()=>draw(b.dataset.rf));draw();
 } else if(tab==='loot'){
  $('archive').innerHTML=`<div class="double"><input id="item-search" aria-label="物资名称搜索" placeholder="搜索物资名称" value="" style="width:100%;padding:11px;border-radius:8px;color:#eaf4f6;background:#102330;border:1px solid #355066"/><select id="item-filter" aria-label="按物资品质筛选" style="width:100%;padding:11px;border-radius:8px;color:#eaf4f6;background:#102330;border:1px solid #355066"><option value="all">全部品质</option><option value="red">红色</option><option value="gold">金色</option><option value="purple">紫色</option><option value="blue">蓝色</option><option value="green">绿色</option><option value="white">白色</option><option value="found">已解锁</option></select></div><div class="small" style="margin:12px 0" id="catalog-count"></div><div id="catalog-results"></div>`;
  const labels={red:'红色',gold:'金色',purple:'紫色',blue:'蓝色',green:'绿色',white:'白色'};
  const render=()=>{const q=$('item-search').value.trim(),f=$('item-filter').value;const list=all.filter(g=>(f==='all'||(f==='found'?save.found[g.id]>0:g.grade===f))&&g.name.includes(q));$('catalog-count').textContent=`显示 ${list.length} 种 · 普通容器大红5% · 非洲之心0.5% · 海洋之泪仅特殊兵盒0.5%`; $('catalog-results').innerHTML=list.map(g=>`<div class="item"><div><b class="${isRed(g)?'gold':''}">${save.found[g.id]?'✦ ':'◇ '}${g.name}</b><small>${labels[g.grade]||g.grade} · ${g.group} · ${g.slots}格 · 已带出 ${save.found[g.id]||0} 次</small></div><div class="small" style="text-align:right">${N(g.price)}<br>模拟价值</div></div>`).join('')||'<p class="small">没有匹配物资</p>'};$('item-search').oninput=render;$('item-filter').onchange=render;render();
 } else if(tab==='ach')$('archive').innerHTML=DATA.achievements.map(a=>`<div class="tile"><b class="${save.ach.includes(a.id)?'good':''}">${save.ach.includes(a.id)?'✓':'◇'} ${a.name}</b><div class="small">${a.desc}</div></div>`).join('');
 else $('archive').innerHTML=`<h3>本模拟器抽取规则</h3><p>以30类容器等比例搜索作为模拟基准：常规容器大红平均 <b>5%</b>，非洲之心 <b>0.5%</b>、其他红合计 <b>4.5%</b>；海洋之泪不在常规池，仅成功开启特殊兵战利品盒后按 <b>0.5%</b> 独立判定；各容器单次爆率不同，且医疗、电子类容器不会产工艺藏品。抽出物资后才判断背包空间，不会因为背包满重新抽签。</p><p>大红收集图鉴共 <b>${red.length}</b> 项，仅来自用户上传 Excel 的真实命名红色收集品；去除了重复项和无名占位，不再以其他品质物资凑数。限定款暂不可通过普通容器搜索获得。</p><p>该概率不是官方三角洲掉率。地图、干员、医疗事件均不提高红色概率。物资图鉴数据来源见压缩包 SOURCES.md 和 CATALOG.md。</p>`;
 $('return').onclick=homepage;$('tab-reds').onclick=()=>gallery('reds');$('tab-loot').onclick=()=>gallery('loot');$('tab-ach').onclick=()=>gallery('ach');$('tab-data').onclick=()=>gallery('data');
}
$('back').onclick=()=>{if(run&&!run.ended&&['scene','extract','containers','locations','safe','special','mandatory-vault'].includes(page)&&!confirm('离开将丢失本局未结算物资，确定退出吗？'))return;homepage()};homepage();
</script></body></html>
