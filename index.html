// Container-weighted simulator rates, calibrated against an equal-container reference mix.
const BASECON=DATA.containers;
function eligible(g,c){return c.categories.includes(g.lootCategory)}
const WEIGHTS={red:c=>c.weight,rare:c=>c.weight*(c.categories.includes('工艺藏品')?1:0)};
const sumWeight=(fn)=>BASECON.reduce((s,c)=>s+fn(c),0)/BASECON.length;
const REDAVG=sumWeight(c=>c.weight*(DATA.goods.some(g=>g.grade==='red'&&g.id!=='heart'&&g.id!=='ocean'&&eligible(g,c))?1:0));
const RAREAVG=sumWeight(c=>c.weight*(c.categories.includes('工艺藏品')?1:0));
function rates(c){
 const hasRed=DATA.goods.some(g=>g.grade==='red'&&g.id!=='heart'&&g.id!=='ocean'&&eligible(g,c));
 const rare=c.categories.includes('工艺藏品');
 return {heart:rare?DATA.lootRules.heart*c.weight/RAREAVG:0,ocean:0,other:hasRed?DATA.lootRules.otherRed*c.weight/REDAVG:0};
}
function pickWeighted(items){const weights={white:46,green:32,blue:15,purple:5.5,gold:1.5};let total=0;for(const g of items)total+=weights[g.grade]||1;let r=Math.random()*total;for(const g of items){r-=weights[g.grade]||1;if(r<=0)return g}return items[items.length-1]}
function randItem(c){
 const pool=DATA.goods.filter(g=>eligible(g,c));const non=pool.filter(g=>g.grade!=='red');
 const rate=rates(c),r=Math.random();
 if(r<rate.heart)return DATA.goods.find(g=>g.id==='heart');
 const red=pool.filter(g=>g.grade==='red'&&g.id!=='heart'&&g.id!=='ocean');
 if(red.length&&r<rate.heart+rate.ocean+rate.other)return pick(red);
 return non.length?pickWeighted(non):pick(pool);
}
function currentLocation(){return (DATA.mapLocations[map.id]||[]).find(x=>x.id===run.locationId)}
function candidateContainers(kind){const here=currentLocation();let pool=(here?here.containers.map(id=>BASECON.find(c=>c.id===id)).filter(Boolean):[]);if(kind==='medical')pool=pool.filter(c=>c.categories.includes('医疗道具'));return pool.length?pool:[]}
function gridShape(i){const patterns=[[0,1,4,5],[2,3,6,7],[8,9,12,13],[10,11,14,15],[0,4,8,12],[3,7,11,15]];return patterns[i%patterns.length]}
function takeItem(item,source){run.searches++;if(used()+item.slots>18){run.logs.push(source+' 搜到 '+item.name+'，背包空间不足');return '⚠ '+item.name+' · 空间不足'}run.bag.push(item);run.logs.push(source+' → '+item.name+(isRed(item)?'【大红】':'')+' · '+N(item.price));return item.name+(isRed(item)?' ★大红':'')+' +'+N(item.price)}
function loot(kind,containerId){
 if(run.lastContainerNode===run.idx)return null;
 const c=candidateContainers(kind).find(x=>x.id===containerId);if(!c)return null;
 run.lastContainerNode=run.idx;
 const results=[];const items=[];
 for(let i=0;i<c.draws;i++){const item=randItem(c);items.push(item);results.push(takeItem(item,c.name))}
 run.risk=Math.min(90,run.risk+Math.max(1,Math.round(c.searchSeconds/3)));
 run.lastLoot={container:c.name,items:results};return {container:c,items,results};
}

}
function containerButton(c){const r=rates(c),rate=(r.heart+r.other)*100;return `<button class="option" data-container="${c.id}"><b>${c.name} <span class="pill">${c.id==='safe'||c.id==='small_safe'?'逐格搜索':'物资搜刮'}</span></b><small>${c.categories.join(' / ')} · ${c.draws}次判定 · 模拟单次大红 ${rate.toFixed(2)}% · 约${c.searchSeconds}秒</small></button>`}
function locationView(){page='locations';const places=DATA.mapLocations[map.id];const here=currentLocation();view.innerHTML=`<div class="eyebrow">TACTICAL MAP // ${map.name}</div><h1>选择行动物资点</h1>${banner()}<p class="small">区域级示意位置，不是游戏地图的精确坐标。进入新区域后有 3.5% 概率触发特殊兵种遭遇。</p><div class="tac-map"><div class="map-grid"></div>${places.map(loc=>`<button class="map-pin ${here?.id===loc.id?'active':''} ${run.visited.includes(loc.id)?'visited':''}" style="left:${loc.x}%;top:${loc.y}%" data-loc="${loc.id}" aria-label="${loc.name}">${loc.containers.length}</button>`).join('')}</div><div class="card"><h3>可选区域与物资点</h3>${places.map(l=>`<button class="option" data-loc="${l.id}"><b>${l.name} ${run.visited.includes(l.id)?'✓':''}</b><small>${l.description} · ${l.containers.length}类容器</small></button>`).join('')}</div><button class="btn" id="loc-return">返回行动</button>`;
 view.querySelectorAll('[data-loc]').forEach(el=>el.onclick=()=>enterLocation(el.dataset.loc));$('loc-return').onclick=scene;
}
function enterLocation(id){const l=DATA.mapLocations[map.id].find(x=>x.id===id);if(!l)return;const first=!run.visited.includes(id);if(first)run.visited.push(id);run.locationId=id;run.logs.push('转移至 '+l.name);run.risk=Math.min(90,run.risk+(first?3:1));if(first && Math.random()<DATA.lootRules.specialEncounterChancePerNewLocation && !run.specialDone.includes(id)){run.special={loc:id,enemy:pick(DATA.specialEnemies),stage:'encounter'};specialView()}else scene()}
function specialView(){page='special';const x=run.special;if(!x){scene();return}view.innerHTML=`<div class="eyebrow">RARE ENCOUNTER // ${currentLocation()?.area||map.name}</div><h1 class="gold">⚠ 特殊敌兵接敌</h1>${banner()}<div class="card"><span class="pill">低概率独立事件</span><h2>${x.enemy.name} 出现在物资点附近</h2><p>该事件为本模拟器原创设计。常规容器永远不会出现海洋之泪；只有成功取得特殊兵战利品盒并搜索时，才进行一次 0.5% 的海洋之泪判定。</p><button class="option" id="special-fight"><b>使用暗号标记目标 · 尝试击败</b><small>有战斗失败风险；成功后获得独立盒子判定</small></button><button class="option" id="special-avoid"><b>放弃战利品 · 绕行离开</b><small>风险降低，不会获得特殊掉落</small></button></div>`;$('special-fight').onclick=()=>fightSpecial();$('special-avoid').onclick=()=>{run.specialDone.push(x.loc);run.special=null;run.risk=Math.max(0,run.risk-3);run.logs.push('规避'+x.enemy.name+'并放弃战利品');scene()}}
function fightSpecial(){const x=run.special;if(!x)return;run.specialDone.push(x.loc);const chance=Math.min(.75,Math.max(.15,(x.enemy.combatRisk+run.risk*.25-(char.id==='wolf'?8:0))/100));if(Math.random()<chance){run.hp=Math.max(1,run.hp-20-Math.floor(Math.random()*22));run.risk=Math.min(90,run.risk+12);run.logs.push('与'+x.enemy.name+'交火失利，未取得盒子');run.special=null;scene();return}
 run.risk=Math.min(90,run.risk+6);const got=Math.random()<DATA.lootRules.specialOceanBox;const reward=got?DATA.goods.find(g=>g.id==='ocean'):pickWeighted(DATA.goods.filter(g=>g.grade!=='red'&&['工具材料','电子物品','医疗道具'].includes(g.lootCategory)));
 const result=takeItem(reward,x.enemy.name+'战利品盒');run.lastLoot={container:x.enemy.name+'战利品盒',items:[result]};run.logs.push('已开启'+x.enemy.name+'战利品盒，海洋之泪独立判定 '+(got?'成功':'未命中'));run.special=null;scene();}
function processChoice(i){if(!run||run.ended)return;let e=run.events[run.idx],c=e.choices[i],type=c[1];run.risk+=c[2];run.logs.push(`${e.title} → ${c[0]}`);if(type==='loot'||type==='medical'){let choices=candidateContainers(type==='medical'?'medical':undefined);let preferred=choices.filter(x=>type==='medical'?x.categories.includes('医疗道具'):true);if(preferred.length)loot(type,pick(preferred).id);else run.logs.push('此区域没有可搜的对应容器')}if(type==='sort'){run.bag.sort((a,b)=>b.price/b.slots-a.price/a.slots);let slots=0;run.bag=run.bag.filter(g=>{slots+=g.slots;return slots<=14});run.logs.push('整理并抛弃低价值物资，释放部分空间')}
if(type==='heal')run.hp=Math.min(100,run.hp+25);
if(type==='help'){run.rescues++;if(char.id==='butterfly')run.risk-=8;else if(char.id==='medic')run.risk-=6;run.logs.push('完成一次救援');}
if(type==='smoke'&&['medic','butterfly'].includes(char.id))run.risk-=10;
if(type==='rush'&&char.id==='wolf')run.risk-=16;
run.risk=Math.max(3,Math.min(90,run.risk));if(roll(Math.max(.025,run.risk/230))){run.hp=Math.max(1,run.hp-15-Math.floor(Math.random()*18));run.logs.push('遭遇压制，生命状态下降')}
if(type==='exit'){run.idx=run.events.length;extract();return}
run.idx++;run.idx<run.events.length?scene():extract()}
function banner(){return `<div class="stats"><div class="stat"><span>生命</span><b class="${run.hp<40?'red':''}">${run.hp}%</b></div><div class="stat"><span>警戒风险</span><b class="${run.risk>55?'red':''}">${run.risk}</b></div><div class="stat"><span>背包</span><b>${used()}/18</b></div></div><div class="meter"><i style="width:${used()/18*100}%"></i></div>`}
function scene(){page='scene';const e=run.events[run.idx];view.innerHTML=`<div class="eyebrow">${map.name.toUpperCase()} // ${currentLocation()?.name||"尚未选择地点"} // NODE ${run.idx+1} / ${run.events.length}</div><h1>${e.title}</h1>${banner()}${run.lastLoot?`<div class="card"><h3>刚才搜索：${run.lastLoot.container}</h3>${run.lastLoot.items.map(x=>`<div class="small">▸ ${x}</div>`).join('')}</div>`:``}<div class="card"><span class="pill">${e.phase}</span><span class="pill">${char.name}</span><div class="story">${e.desc}</div>${e.choices.map((c,i)=>`<button class="option" data-opt="${i}"><b>${i+1}. ${c[0]}</b><small>${c[3]} · ${c[2]>0?'风险增加':'风险较低'}</small></button>`).join('')}</div><div class="card"><div class="headbar"><h3>背包物资</h3><span class="small">估值 ${N(total())}</span></div>${run.bag.length?itemsTable(run.bag):'<p class="small">尚未获得物资。</p>'}</div><div class="double"><button class="btn" id="chooseLocation">📍 选择地图物资点</button><button class="btn primary" id="searchContainer" ${run.lastContainerNode===run.idx?'disabled':''}>${run.lastContainerNode===run.idx?'本阶段已搜索':'搜索附近容器'}</button><button class="btn" id="extractEarly">尝试提前撤离 →</button></div>`;view.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>processChoice(+b.dataset.opt));$('extractEarly').onclick=extract;$('searchContainer').onclick=()=>{if(!currentLocation())locationView();else containerView()};$('chooseLocation').onclick=locationView}
function extract(){page='extract';view.innerHTML=`<div class="eyebrow">EXTRACTION DECISION</div><h1>最后的撤离抉择</h1>${banner()}<div class="card"><p>剩余生命 ${run.hp}%，背包估值 ${N(total())} 模拟哈夫币。撤离路线有固定、条件、特殊等多种类型；本原型只抽象风险，不模拟某个真实点位的具体开启条件。</p><button class="option" id="quiet"><b>保持静默，谨慎撤离</b><small>基础风险 -13；蜂医与蝶偏向这条路线</small></button><button class="option" id="fast"><b>快速突围，抢时间撤离</b><small>基础风险 +12；红狼获得机动优势</small></button></div>`;$('quiet').onclick=()=>finish(false);$('fast').onclick=()=>finish(true)}
function unlock(cond,id){if(cond&&!save.ach.includes(id))save.ach.push(id)}
function finish(fast){if(!run||run.ended)return;run.ended=true;run.lastFast=fast;let danger=run.risk+(fast?12:-13)+(100-run.hp)*.16-(fast&&char.id==='wolf'?19:0)-(!fast&&char.id==='medic'?7:0);danger=Math.min(92,Math.max(6,danger));let ok=!roll(danger/100);let reds=run.bag.filter(isRed);let gain=ok?total():0;let ending='撤离失败 · 暂时失联';if(ok){if(run.rescues)ending='义务救援 · 带队归航';else if(reds.length>=2)ending='满载归航 · 红运当头';else if(run.hp<=40)ending='惊险生还 · 极限返航';else if(char.id==='wolf'&&fast)ending='极速突围 · 红狼时刻';else ending='稳健撤离 · 平安归来';save.wins++;save.profit+=gain;if(reds.length)save.redWins++;if(run.rescues)save.rescueWins++;for(const g of run.bag)save.found[g.id]=(save.found[g.id]||0)+1;save.winFlags[char.id+'Win']=true;save.winFlags[map.id+'Win']=true;if(run.rescues)save.winFlags[char.id+'Rescue']=true;}
unlock(ok&&save.wins>=1,'first');unlock(save.runs>=10,'ten');unlock(ok&&run.hp<=40,'survivor');unlock(save.redWins>=1,'red');unlock(ok&&reds.length>=2,'triple');unlock(ok&&char.id==='wolf','wolf');unlock(ok&&char.id==='medic'&&run.rescues>0,'medic');unlock(ok&&char.id==='butterfly'&&run.rescues>0,'butterfly');unlock(ok&&map.id==='dam','dam');unlock(ok&&map.id==='az3','az3');unlock(ok&&map.id==='space','space');unlock(ok&&run.searches<=1,'minimal');unlock(ok&&gain>=10000000,'big');unlock(Object.keys(save.found).length>=8,'collector');unlock(save.rescueWins>=3,'altruist');store();page='result';view.innerHTML=`<div class="eyebrow">AFTER ACTION REPORT</div><h1 class="${ok?'good':'red'}">${ending}</h1><div class="card"><div class="small">本局实际带出收益</div><div class="big ${ok?'gold':'red'}">${N(gain)}</div><div class="small">模拟哈夫币 · ${ok?'已保存到图鉴':'未成功带出物资'} · 本局警戒 ${Math.round(danger)}%</div><hr class="divider"><h3>本局搜得物品 (${run.bag.length})</h3>${run.bag.length?itemsTable(run.bag):'<p class="small">本局没有物资</p>'}</div><div class="card"><h3>行动日志</h3>${run.logs.map(x=>`<p class="small zero">▸ ${x}</p>`).join('')||'<p class="small">没有行动记录</p>'}</div><div class="double"><button class="btn primary" id="again">再来一局</button><button class="btn" id="collect">图鉴 / 成就</button></div>`;$('again').onclick=start;$('collect').onclick=()=>gallery('loot')}
function gallery(tab='loot', filter='all', query=''){
 page='gallery'; const all=DATA.goods, red=all.filter(isRed), known=all.filter(g=>save.found[g.id]>0);
 view.innerHTML=`<div class="eyebrow">FIELD ARCHIVE // ${DATA.version}</div><h1>物资图鉴与行动档案</h1><p class="small">物资名称来自公开图鉴；容器可掉落类别参考玩家研究，精确概率、价格和占格均为模拟参数。累计解锁 ${known.length}/${all.length} 种。</p><div class="tabs"><button id="tab-loot" class="${tab==='loot'?'active':''}">全部物资 ${all.length}</button><button id="tab-ach" class="${tab==='ach'?'active':''}">成就 ${save.ach.length}/${DATA.achievements.length}</button><button id="tab-data" class="${tab==='data'?'active':''}">爆率与来源</button></div><div class="card" id="archive"></div><button class="btn" id="return">返回主菜单</button>`;
 if(tab==='loot'){
  $('archive').innerHTML=`<div class="double"><input id="item-search" aria-label="物资名称搜索" placeholder="搜索物资名称" value="" style="width:100%;padding:11px;border-radius:8px;color:#eaf4f6;background:#102330;border:1px solid #355066"/><select id="item-filter" aria-label="按物资品质筛选" style="width:100%;padding:11px;border-radius:8px;color:#eaf4f6;background:#102330;border:1px solid #355066"><option value="all">全部品质</option><option value="red">红色</option><option value="gold">金色</option><option value="purple">紫色</option><option value="blue">蓝色</option><option value="green">绿色</option><option value="white">白色</option><option value="found">已解锁</option></select></div><div class="small" style="margin:12px 0" id="catalog-count"></div><div id="catalog-results"></div>`;
  const labels={red:'红色',gold:'金色',purple:'紫色',blue:'蓝色',green:'绿色',white:'白色'};
  const render=()=>{const q=$('item-search').value.trim(),f=$('item-filter').value;const list=all.filter(g=>(f==='all'||(f==='found'?save.found[g.id]>0:g.grade===f))&&g.name.includes(q));$('catalog-count').textContent=`显示 ${list.length} 种 · 普通容器大红5% · 非洲之心0.5% · 海洋之泪仅特殊兵盒0.5%`; $('catalog-results').innerHTML=list.map(g=>`<div class="item"><div><b class="${isRed(g)?'gold':''}">${save.found[g.id]?'✦ ':'◇ '}${g.name}</b><small>${labels[g.grade]||g.grade} · ${g.group} · ${g.slots}格 · 已带出 ${save.found[g.id]||0} 次</small></div><div class="small" style="text-align:right">${N(g.price)}<br>模拟价值</div></div>`).join('')||'<p class="small">没有匹配物资</p>'};$('item-search').oninput=render;$('item-filter').onchange=render;render();
 } else if(tab==='ach')$('archive').innerHTML=DATA.achievements.map(a=>`<div class="tile"><b class="${save.ach.includes(a.id)?'good':''}">${save.ach.includes(a.id)?'✓':'◇'} ${a.name}</b><div class="small">${a.desc}</div></div>`).join('');
 else $('archive').innerHTML=`<h3>本模拟器抽取规则</h3><p>以30类容器等比例搜索作为模拟基准：常规容器大红平均 <b>5%</b>，非洲之心 <b>0.5%</b>、其他红合计 <b>4.5%</b>；海洋之泪不在常规池，仅成功开启特殊兵战利品盒后按 <b>0.5%</b> 独立判定；各容器单次爆率不同，且医疗、电子类容器不会产工艺藏品。抽出物资后才判断背包空间，不会因为背包满重新抽签。</p><p>该概率不是官方三角洲掉率。地图、干员、医疗事件均不提高红色概率。物资图鉴数据来源见压缩包 SOURCES.md 和 CATALOG.md。</p>`;
 $('return').onclick=homepage;$('tab-loot').onclick=()=>gallery('loot');$('tab-ach').onclick=()=>gallery('ach');$('tab-data').onclick=()=>gallery('data');
}
$('back').onclick=()=>{if(run&&!run.ended&&['scene','extract','containers','locations','safe','special'].includes(page)&&!confirm('离开将丢失本局未结算物资，确定退出吗？'))return;homepage()};homepage();
</script></body></html>
