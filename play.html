<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>三角洲跑刀模拟器 · 修复测试版</title><style>
:root{color-scheme:dark;--bg:#07111d;--panel:#142536;--line:#294355;--acid:#b5f25b;--text:#e9f2f8;--muted:#94a9b8}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0,#1b3e4c,#07111d 65%);color:var(--text);font:15px/1.65 system-ui,-apple-system,"Microsoft YaHei",sans-serif;min-height:100dvh}
main{width:min(760px,100%);margin:auto;padding:22px 16px 90px}header{display:flex;justify-content:space-between;align-items:start;gap:12px;margin-bottom:18px}.brand{font-weight:900;letter-spacing:2px;color:var(--acid);font-size:13px}small,.muted{color:var(--muted)}h1{font-size:24px;margin:7px 0 4px}h2{font-size:20px;margin:0 0 12px}h3{margin:0 0 6px}.panel{background:linear-gradient(145deg,#172e3e,#101d2d);border:1px solid var(--line);border-radius:17px;padding:18px;margin:14px 0;box-shadow:0 12px 40px #0002}.options{display:grid;gap:10px}.two{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}button{font:inherit;color:inherit;border:1px solid #365266;background:#172b3d;border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;min-height:49px}button:active{transform:translateY(1px)}button.primary{background:var(--acid);border-color:var(--acid);color:#0c1822;font-weight:800}button.selected{border:2px solid var(--acid);background:#294437}.nav{display:flex;flex-wrap:wrap;gap:7px;margin:20px 0}.nav button{font-size:13px;min-height:42px;padding:9px 11px}.stat{display:inline-flex;background:#0b1c29;border:1px solid var(--line);border-radius:30px;padding:5px 10px;margin:3px;color:#cfe3ed;font-size:12px}.item{padding:10px 12px;background:#091d29;border:1px solid var(--line);border-radius:10px;margin:7px 0;display:flex;justify-content:space-between;gap:12px}.gold{color:#ffce7c}.danger{color:#ff9191}.tip{border-left:3px solid var(--acid);padding-left:12px;color:#c3d3df}p{margin:9px 0}.footer{text-align:center;margin-top:40px;font-size:11px;color:#637d90}#err{white-space:pre-wrap;color:#ffbdbd}
</style></head><body><main><header><div><div class="brand">DELTA · KNIFE RUN / FAN MADE</div><small>战术搜刮 · 路线抉择 · 生死撤离 · 大红图鉴</small></div><small>离线逻辑 · 手机适配版</small></header><nav class="nav"><button onclick="go('home')">🏠 出击大厅</button><button onclick="go('gallery')">💎 大红图鉴</button><button onclick="go('record')">📊 战绩 / 成就</button><button onclick="go('rules')">📖 规则</button></nav><div id="app"></div><div id="err"></div><div class="footer">玩家自制非官方模拟器 · 与《三角洲行动》官方无关 · 数值仅供娱乐</div></main><script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const ops=[{id:'red',name:'红狼',icon:'🐺',desc:'突击型，遭遇敌人时更敢冲；冲刺路线有优势。',bonus:0.15},{id:'bee',name:'蜂医',icon:'🩺',desc:'支援型，受伤后有更好的补救机会。',bonus:0.10},{id:'butter',name:'蝶',icon:'🦋',desc:'侦察型，谨慎搜索更容易避开危险。',bonus:0.12}];
const maps=[{id:'dam',name:'普通大坝',risk:0.10,mult:1,desc:'更适合轻装起步，路线相对宽松。'},{id:'az',name:'机密 AZ3',risk:0.22,mult:1.75,desc:'高收益伴随更高交战压力。'},{id:'space',name:'绝密航天',risk:0.33,mult:2.5,desc:'高风险地图，撤离更困难。'}];
const loot=[{id:'heart',name:'非洲之心',price:1200000,rare:true},{id:'ocean',name:'海洋之泪',price:850000,rare:true},{id:'gold',name:'金条',price:170000,rare:true},{id:'cpu',name:'高性能处理器',price:42000},{id:'camera',name:'专业相机',price:35000},{id:'drive',name:'固态硬盘',price:18000},{id:'battery',name:'电池',price:4500},{id:'parts',name:'电子元件',price:7500}];
let state={page:'home',op:'red',map:'dam',round:null};
const read=(k,fallback)=>{try{return JSON.parse(localStorage.getItem('knife_'+k))??fallback}catch(e){return fallback}};
const save=(k,v)=>{try{localStorage.setItem('knife_'+k,JSON.stringify(v))}catch(e){}};
const currency=n=>Math.round(n).toLocaleString('zh-CN');
const pick=a=>a[Math.floor(Math.random()*a.length)];
const op=()=>ops.find(x=>x.id===state.op);
const mp=()=>maps.find(x=>x.id===state.map);
const total=()=>state.round.items.reduce((a,b)=>a+b.price,0);
const display=(html)=>{$('app').innerHTML=html;window.scrollTo({top:0,behavior:'instant'})};
const buttons=(rows,fn)=>'<div class="options">'+rows.map((x,i)=>'<button onclick="'+fn+'('+i+')">'+x+'</button>').join('')+'</div>';
window.go=function(page){state.page=page;render()};
window.chooseOp=function(i){state.op=ops[i].id;render()};
window.chooseMap=function(i){state.map=maps[i].id;render()};
function home(){
const opBtns=ops.map((x,i)=>'<button class="'+(state.op===x.id?'selected':'')+'" onclick="chooseOp('+i+')"><strong>'+x.icon+' '+x.name+'</strong><br><small>'+x.desc+'</small></button>').join('');
const mapBtns=maps.map((x,i)=>'<button class="'+(state.map===x.id?'selected':'')+'" onclick="chooseMap('+i+')"><strong>'+x.name+'</strong><br><small>'+x.desc+'</small></button>').join('');
display('<section class="panel"><h1>⚡ 出击大厅</h1><p class="muted">选干员、选地图，摸物资并成功撤离。整个游戏只靠点击操作，不需要开麦。</p><h2>① 选择干员</h2><div class="options two">'+opBtns+'</div><h2 style="margin-top:22px">② 选择地图</h2><div class="options two">'+mapBtns+'</div><p class="tip">本次：'+op().name+' · '+mp().name+'。模拟设定并非官方概率。</p><button class="primary" style="width:100%;text-align:center" onclick="start()">开始跑刀 →</button></section>');
}
window.start=function(){state.round={stage:0,hp:100,items:[],alive:true,signals:0,log:['轻装进入 '+mp().name],risk:mp().risk,decisions:0};state.page='game';render()};
const stages=[
{title:'出生点：观察路线',desc:'前方有岔路。一条近路靠近高资源区，另一条绕开高交战区。',choices:[['走主路，快速抢点',0.18,1.5],['沿掩体谨慎绕行',-0.06,0.7],['先观察敌方动向',-0.10,0.45]]},
{title:'第一处物资点',desc:'听到远处枪声。你发现一间可以搜索的房间，附近可能有人。',choices:[['直接开箱，搜贵重物品',0.19,1.8],['快速扫货，不恋战',0.02,1],['先听脚步、确认安全再搜',-0.10,0.65]]},
{title:'遭遇其他干员',desc:'转角看见另一名干员，他似乎也没带多少装备。游戏里不能开麦，你只能通过动作打暗号。',choices:[['蹲起两次示意友好，尝试绕开',-0.06,0.7],['举枪压制，抢先通过',0.22,1.3],['立即转身绕路，不接触',-0.15,0.35]]},
{title:'最后一个高价值房间',desc:'撤离时间逼近。你的背包还剩空间，门里可能有大红，也可能有人埋伏。',choices:[['赌一把：深入搜索',0.26,2.4],['只摸门边物资',0.08,1.05],['见好就收，直奔撤离点',-0.12,0]]},
{title:'撤离点',desc:'撤离点附近可能被架枪。你需要决定最后的路线。',choices:[['直接冲向撤离区',0.17,0],['绕侧翼观察后进点',-0.09,0],['先找掩体，确认安全再进入',-0.14,0]]}
];
window.act=function(i){let r=state.round,s=stages[r.stage],c=s.choices[i];r.decisions++;r.log.push(s.title+'：'+c[0]);let danger=Math.max(0.03,Math.min(0.8,r.risk+c[1]));if(state.op==='red'&&i===0)danger-=0.07;if(state.op==='butter'&&i===2)danger-=0.08;if(state.op==='bee'&&r.hp<75)danger-=0.06;danger=Math.max(.02,danger);if(Math.random()<danger){const dmg=16+Math.floor(Math.random()*38);r.hp-=dmg;r.log.push('遭遇敌人，损失 '+dmg+' 生命值');if(state.op==='bee'&&r.hp>0){r.hp=Math.min(100,r.hp+20);r.log.push('蜂医获得额外恢复 +20')}if(r.hp<=0){r.hp=0;r.alive=false;return finish()}}
if(c[2]>0){const rolls=c[2]>1.6?3:c[2]>0.8?2:1;for(let j=0;j<rolls;j++){const rareChance=.055*mp().mult*(i===0?1.5:1);const pool=Math.random()<rareChance?loot.slice(0,3):loot.slice(3);const thing=pick(pool);r.items.push({...thing,price:Math.round(thing.price*mp().mult)});r.log.push('搜到：'+thing.name)}}
r.stage++;if(r.stage>=stages.length)return finish();render()};
function game(){let r=state.round;if(!r){state.page='home';return home()}let s=stages[r.stage];display('<section class="panel"><span class="stat">干员 '+op().name+'</span><span class="stat">'+mp().name+'</span><span class="stat">生命 '+r.hp+'/100</span><span class="stat">背包 '+r.items.length+' 件</span><h1>'+s.title+'</h1><p>'+s.desc+'</p><div class="panel"><h3>🎒 当前背包 · '+currency(total())+' 哈夫币</h3>'+(r.items.length?r.items.map(x=>'<div class="item"><span class="'+(x.rare?'gold':'')+'">'+(x.rare?'💎 ':'')+x.name+'</span><span>'+currency(x.price)+'</span></div>').join(''):'<p class="muted">暂无战利品</p>')+'</div><h3>你的选择</h3>'+buttons(s.choices.map(x=>x[0]),'act')+'<p class="muted">第 '+(r.stage+1)+' / '+stages.length+' 个情境。选择有不同风险和收益。</p></section>')};
function finish(){const r=state.round;state.page='end';const records=read('records',[]);const sum=r.alive?total():0;records.unshift({time:new Date().toLocaleString('zh-CN'),op:op().name,map:mp().name,success:r.alive,value:sum,items:r.alive?r.items:[]});save('records',records.slice(0,100));if(r.alive){const gallery=read('gallery',{});for(const it of r.items){if(it.rare)gallery[it.id]=(gallery[it.id]||0)+1}save('gallery',gallery)}render()}
function end(){const r=state.round;display('<section class="panel"><h1>'+(r.alive?'✅ 成功撤离':'☠️ 撤离失败')+'</h1><p class="muted">'+op().name+' · '+mp().name+'</p><h2>本局带出收益：<span class="gold">'+currency(r.alive?total():0)+'</span> 哈夫币</h2><p>'+(r.alive?'本局带出 '+r.items.length+' 件物资。':'战利品全部损失。')+'</p><h3>稀有物品</h3>'+(r.alive&&r.items.some(x=>x.rare)?r.items.filter(x=>x.rare).map(x=>'<div class="item gold">💎 '+x.name+'<span>'+currency(x.price)+'</span></div>').join(''):'<p class="muted">本局没有带出大红。</p>')+'<h3>本局记录</h3>'+r.log.map(x=>'<p class="muted">• '+x+'</p>').join('')+'<div class="options two"><button class="primary" onclick="go(\'home\')">再来一局</button><button onclick="go(\'gallery\')">查看大红图鉴</button></div></section>')}
function gallery(){const data=read('gallery',{});display('<section class="panel"><h1>💎 大红图鉴</h1><p class="muted">只有成功撤离并带出的大红才会被记录，保存在当前浏览器。</p>'+loot.filter(x=>x.rare).map(x=>'<div class="item"><strong class="'+(data[x.id]?'gold':'muted')+'">'+(data[x.id]?'💎 '+x.name:'🔒 未解锁')+'</strong><span>带出 '+(data[x.id]||0)+' 次</span></div>').join('')+'<button class="primary" onclick="go(\'home\')">返回大厅</button></section>')}
function record(){const list=read('records',[]);display('<section class="panel"><h1>📊 战绩 / 成就</h1><p class="muted">本机历史对局：'+list.length+' · 成功撤离：'+list.filter(x=>x.success).length+' · 总带出：'+currency(list.reduce((n,x)=>n+x.value,0))+' 哈夫币</p>'+(list.length?list.slice(0,25).map(x=>'<div class="item"><div><strong>'+(x.success?'✅ 成功':'☠️ 失败')+' · '+x.map+'</strong><br><small>'+x.op+' · '+x.time+'</small></div><span>'+currency(x.value)+'</span></div>').join(''):'<p>暂无对局记录，先去跑一把。</p>')+'<button class="primary" onclick="go(\'home\')">返回大厅</button></section>')}
function rules(){display('<section class="panel"><h1>📖 游戏规则</h1><p>① 选择红狼、蜂医或蝶，以及普通大坝、机密 AZ3、绝密航天。</p><p>② 每局依次经历路线、搜刮、遭遇、最后搜索和撤离五个情境。</p><p>③ 不开麦；与其他干员交流时只使用蹲起等动作暗号。</p><p>④ 不同选择改变遭遇风险、物资收益和结局。生命值归零则撤离失败。</p><p>⑤ 成功带出的大红会进入图鉴；记录只存本机，清除浏览器数据会丢失。</p><p class="tip">本版本是网页交互修复测试，物品价值、掉率、路线为玩家自定义模拟数据，不代表游戏实时行情。</p><button class="primary" onclick="go(\'home\')">进入大厅</button></section>')}
function render(){try{if(state.page==='home')home();else if(state.page==='game')game();else if(state.page==='end')end();else if(state.page==='gallery')gallery();else if(state.page==='record')record();else rules()}catch(e){$('err').textContent='运行出错：'+e.message}}
render();
})();
</script></body></html>
