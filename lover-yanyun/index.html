let save=readSave(),game=null,screen='home',setup={name:'少侠',path:'newbie',temperament:'rational'},currentEvent=null,lastEnding=null;
function readSave(){try{const p=JSON.parse(localStorage.getItem(STORAGE)||'{}');return{runs:p.runs||0,seen:p.seen||{},cgs:p.cgs||{},achievements:p.achievements||{},history:p.history||[],sound:p.sound!==false}}catch{return{runs:0,seen:{},cgs:{},achievements:{},history:[],sound:true}}}
function persist(){try{localStorage.setItem(STORAGE,JSON.stringify(save))}catch(e){toast('浏览器无法保存进度，请检查隐私模式或存储权限。')}}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function el(s){document.getElementById('app').innerHTML=s}function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.remove('hide');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.add('hide'),2800)}
function hdr(){return `<div class="top"><div class="brand"><span class="brandmark">缘</span>恋与燕云 <span class="tiny">SIMULATOR 1.5</span></div><div class="topright"><span class="tiny">已通关 ${save.runs} 局</span><button class="navbtn" onclick="showHome()">⌂ 首页</button></div></div>`}
function showHome(){screen='home';game=null;currentEvent=null;el(hdr()+`<section class="hero"><div class="hero-scene"><img class="hero-photo" src="assets/hero-duo.jpg" alt="樱花树下相伴而立的两位江湖侠客"><div class="hero-wash"></div><div class="hero-frame"></div></div><div class="hero-inscription">江湖有梦 · 情缘未央</div><div class="hero-sidecard"><div class="thumb" role="img" aria-label="古风水墨人物参考画面"></div><div class="copy"><span>侠影入画</span><strong>一半是江湖，一半是心动。</strong></div></div><div class="hero-inner"><div class="eyebrow">A TALE OF LOVE & JIANGHU</div><h1>恋与<br><em>燕云</em></h1><div class="tagline">十次抉择，遇见你的江湖心动。</div><div class="hero-desc">在《燕云十六声》的江湖里，缘分桥初遇、觉障林双排、深夜耳语，可能通向一场盛大的爱情，也可能成为瓜房里的离谱传说。十回合之内，你总会遇见那位让你动心的她。</div><div class="creator-credit">沈狂狂狂狂制作</div><div class="cta-row"><button class="btn" onclick="showSetup()">开始我的江湖情缘　❥</button><button class="btn secondary" onclick="showEndings()">✧ 结局图鉴</button><button class="btn secondary" onclick="showCGs()">▧ CG画廊</button></div><div class="hero-detail">恋爱主线 70%+ · 武侠氛围 · 多女主 · 10回合</div></div></section><section class="home-epilogue"><div class="scene-image" role="img" aria-label="雨夜荷塘孤舟的武侠江湖场景"></div><div class="scene-copy"><div class="eyebrow">缘起十回合</div><h2>江湖那么大，偏偏遇见你。</h2><p>她也许是黏人的小徒弟、温柔的御姐、高冷的论剑高手，或总在刷纪录的竞速少女。你们的故事，从一次寻常上线开始，也可能在一次奔现、一次误会、一次深夜语音之后彻底改变。</p><div class="scene-tags"><span>女大学生徒弟</span><span>御姐音休闲玩家</span><span>PVP女高手</span><span>竞速妹</span></div></div></section><section class="strip"><div class="mini"><strong>${save.runs}</strong><span>已经历的人生</span></div><div class="mini"><strong>${Object.keys(save.seen).length}/${endings.length}</strong><span>结局收集</span></div><div class="mini"><strong>${Object.keys(save.cgs).length}/20</strong><span>心动CG收藏</span></div><div class="mini"><strong>10</strong><span>人生回合</span></div></section>`+footer())}

function showSetup(){screen='setup';setup.path='newbie';setup.temperament='rational';el(hdr()+`<section class="panel start-panel"><button class="back" onclick="showHome()">← 返回首页</button><div class="eyebrow">CHAPTER 00 · 普通玩家的故事</div><h1 class="section-title">今晚，上线吗？</h1><p class="muted">你只是一个普通的燕云玩家。可能收获一段爱情，也可能突然走上另一条江湖路。</p><label class="tiny" for="playerName">给自己取个昵称</label><div class="formline"><input id="playerName" maxlength="12" value="${esc(setup.name)}" placeholder="输入昵称" autocomplete="off"></div><div class="starter-note">♥ 10个回合，一段意想不到的江湖人生。职业、情缘与结局，都留给命运和你的选择。</div><button class="btn start-full" onclick="startGame()">❤ 开始第 ${save.runs+1} 段人生</button></section>`+footer())}
function rand(max){return Math.floor(Math.random()*max)}function adjust(delta){for(const [k,v] of Object.entries(delta||{})){if(k in game.stats)game.stats[k]=Math.max(k==='money'?0:0,Math.min(k==='money'?200:100,game.stats[k]+v))}}
function startGame(){setup.name=(document.getElementById('playerName')?.value||'少侠').trim().slice(0,12)||'少侠';setup.path='newbie';setup.temperament='rational';const st={...defaultStats};game={name:setup.name,origin:'newbie',temperament:'rational',role:'普通玩家',stats:st,turn:1,flags:{},visited:{},log:[],npc:namedNPCs[rand(namedNPCs.length)],eventsCompleted:0};screen='game';chooseEvent()}
function weightedPick(pool){let total=pool.reduce((x,e)=>x+e.weight,0),r=Math.random()*total;for(const e of pool){r-=e.weight;if(r<=0)return e}return pool[pool.length-1]}
const rareEventIds=new Set(['opportunity_rank','opportunity_speed','opportunity_stream','opportunity_escort','opportunity_forest','opportunity_player']);
const mandatoryFollowups=new Set(['meet_result','reality','guafang','new_avatar']);
function eligibleEvent(e){return e.condition({...game.stats,flags:game.flags,turn:game.turn});}
function chooseEvent(){
 if(!game)return;
 if(game.turn>10){finishGame();return;}
 let pool=events.filter(e=>!game.visited[e.id]&&eligibleEvent(e));
 if(!pool.length)pool=events.filter(eligibleEvent);
 // 连锁剧情优先，但并非每次都强制：为事件留出合理的时间间隔。
 let follow=pool.filter(e=>mandatoryFollowups.has(e.id));
 const romanceChain=new Set(['nightduo','voice','friend','confess','official','past_lover','verify','meet','misunderstanding','breakup']);
 const romance=pool.filter(e=>romanceChain.has(e.id));
 if(follow.length&&Math.random()<.86){currentEvent=weightedPick(follow);}
 else if(game.flags.met&&romance.length&&Math.random()<.60){currentEvent=weightedPick(romance);}
 else{
   const normal=pool.filter(e=>!rareEventIds.has(e.id)&&!mandatoryFollowups.has(e.id));
   const rare=pool.filter(e=>rareEventIds.has(e.id));
   const hasCareer=game.role!=='普通玩家';
   const pickRare=!hasCareer&&rare.length&&Math.random()<.075;
   currentEvent=weightedPick(pickRare?rare:(normal.length?normal:pool));
 }
 game.visited[currentEvent.id]=(game.visited[currentEvent.id]||0)+1;showTurn();
}
function statPanel(){const cols=[['skill','剑术'],['speed','竞速'],['charm','魅力'],['eq','情商'],['money','财力'],['fame','名气'],['romance','恋爱脑'],['guard','警惕心']];return `<div class="stats">${cols.map(([k,n])=>`<div class="stat"><div class="stat-top"><span>${n}</span><b>${Math.round(game.stats[k])}</b></div><div class="track"><span style="width:${Math.min(100,game.stats[k])}%"></span></div></div>`).join('')}</div>`}
function showTurn(){if(!game)return;screen='game';const ev=currentEvent;const all=ev.choices;const choices=all;game.offeredChoices=choices;el(hdr()+`<section class="panel story-panel"><div class="flex"><div class="hud"><span class="pill">第 ${game.turn} / 10 回合</span><span class="pill">${esc(game.role)}</span></div><button class="navbtn quit" onclick="confirmQuit()">结束本局</button></div><div class="progress"><span style="width:${game.turn/10*100}%"></span></div><div class="scene"><div class="chapter">CHAPTER ${String(game.turn).padStart(2,'0')} · 江湖偶遇</div><h2>${esc(ev.title)}</h2><p>${esc(ev.body.replaceAll('{npc}',game.npc.name))}</p></div><div class="scene-question">此刻，你会……</div><div class="story-choices">${choices.map((c,i)=>`<button class="choice" onclick="doChoice(${i})"><span><b>${'ABCDE'[i]}.</b> ${esc(c.text)}</span><span class="arrow">›</span></button>`).join('')}</div></section>`+footer())}
function tryCareerShift(ev,c){
 if(game.role!=='普通玩家')return '';
 const roles={opportunity_rank:['rank','论剑玩家'],opportunity_speed:['speed','竞速玩家'],opportunity_stream:['stream','主播'],opportunity_escort:['escort','陪玩'],opportunity_forest:['forest','觉障林高手'],opportunity_player:['player','海王']};
 const target=roles[ev.id];if(!target||c.flag!==target[0])return '';
 if(Math.random()>=.3)return '';
 game.role=target[1];game.flags.careerShift=true;game.flags.careerRole=target[0];
 return `江湖机缘！你开始踏上「${target[1]}」之路。`;
}
function doChoice(i){
 if(!game||!currentEvent||!game.offeredChoices?.[i])return;
 const ev=currentEvent,c=game.offeredChoices[i];
 adjust(c.delta);
 if(c.flag)game.flags[c.flag]=true;
 if(c.set)Object.assign(game.flags,c.set);
 // 连锁状态只从明确的玩家选择产生，避免凭空结缘、奔现和被骗。
 if(c.flag==='metInPerson')game.flags.meetResolved=true;
 if(c.flag==='meetDisappointed')game.flags.meetResolved=true;
 if(c.flag==='giftScam')game.flags.gift=true;
 if(c.flag==='player')game.flags.flirtingMultiple=true;
 const shift=tryCareerShift(ev,c);
 game.log.push({turn:game.turn,event:ev.id,choice:c.text,result:c.result});
 game.eventsCompleted++;game.turn++;
 if(shift)toast(shift);
 chooseEvent();
}
function nextTurn(){chooseEvent()}function confirmQuit(){if(!game)return;if(confirm('提前结束本局？将根据当前积累的属性判定结局，并计入游玩次数。'))finishGame()}
function resolveEnding(){
 const f=game.flags,s=game.stats;
 const hasRelationship=!!f.serious;
 const hasMet=!!f.metInPerson;
 let id;
 // 结局必须有事件因果，不允许“没遇到人就结婚”“没练技术就榜一”。
 if(f.privacyRisk&&(s.scandal>=20||f.ppt))id='E15';
 else if(f.giftScam)id='E12';
 else if(f.avatarDrama)id='E14';
 else if(f.ppt)id='E11';
 else if(f.publicFight&&!f.clarified)id='E24';
 else if(f.meetDisappointed)id=(f.unverified&&s.guard<35)?'E13':'E20';
 else if(f.breakup)id='E19';
 else if(f.lasting&&hasMet&&hasRelationship)id=s.eq>=57?'E09':'E03';
 else if(hasMet&&hasRelationship)id=f.verified?'E01':'E04';
 else if(hasRelationship&&f.official)id='E05';
 else if(hasRelationship&&s.affection>=61)id='E10';
 else if(f.flirtingMultiple&&s.scandal>=18)id='E21';
 else if(f.gift&&s.money<25)id='E23';
 else if(game.role==='论剑玩家'&&s.skill>=45)id='E25';
 else if(game.role==='竞速玩家'&&s.speed>=38)id='E26';
 else if(game.role==='主播'&&s.fame>=27)id='E27';
 else if(game.role==='陪玩')id='E28';
 else if(game.role==='觉障林高手')id='E30';
 else if(game.role==='海王')id='E21';
 else if(f.dreamMeme&&s.charm>=30)id='E38';
 else if(f.dreamResolved&&s.eq>=34)id='E38';
 else if(f.mediator&&s.eq>=56&&s.fame>=20)id='E31';
 else if(f.speedPractice&&s.speed>=32)id='E26';
 else if(f.practice&&s.skill>=47)id='E30';
 else if(f.forestPlayed&&s.skill>=43)id='E36';
 else if(f.met&&s.affection>=24)id='E10';
 else if((f.dreamCalled||f.dreamCalm)&&f.dreamMeme)id='E38';
 else if(f.socialized&&s.fame>=24)id='E29';
 else id='E37';
 return endings.find(x=>x.id===id)||endings[29];
}
function finishGame(){if(!game)return;lastEnding=resolveEnding();save.runs++;save.seen[lastEnding.id]=(save.seen[lastEnding.id]||0)+1;save.cgs[lastEnding.cg]=true;const finalResult=game.log.at(-1)?.result||'';const record={choices:game.log.map(x=>({...x})),name:game.name,ending:lastEnding.id,turns:game.eventsCompleted,date:new Date().toLocaleString('zh-CN'),stats:{...game.stats}};save.history.unshift(record);save.history=save.history.slice(0,20);persist();const shouldAd=save.runs%5===0;game=null;showEnding(lastEnding,shouldAd,finalResult)}
function showEnding(ending,shouldAd=false,finalResult=''){screen='ending';const cg=cgData[ending.cg-1];el(hdr()+`<section class="panel"><div class="end-hero"><div class="eyebrow">YOUR DESTINY · ${ending.id}</div><div class="laurel">${ending.kind==='good'?'♥':ending.kind==='career'?'✦':ending.kind==='bad'?'☾':'✧'}</div><h2>${esc(ending.name)}</h2><span class="badge">${({good:'心动佳话',bad:'江湖翻车',career:'独行封神',meme:'隐藏彩蛋'})[ending.kind]}</span><p>${esc(ending.desc)}</p></div>${finalResult?`<div class="notice" role="status">${esc(finalResult)}</div>`:''}<h3>✦ 结局限定 CG · ${esc(cg.name)}</h3>${cgMarkup(cg,true)}<p class="tiny">CG ${String(cg.id).padStart(2,'0')} / 20 · 已实装，达成对应结局后可在CG画廊反复查看</p><div class="ending-actions"><button class="btn" onclick="showSetup()">再次入江湖</button><button class="btn secondary" onclick="showEndings()">结局图鉴</button><button class="btn secondary" onclick="showCGs()">CG画廊</button></div></section>`+footer());if(shouldAd)setTimeout(showAd,160)}

add('pre1','今晚先打什么？','你刚上线，群里一边喊打本，一边喊“在线蹲情缘”。你还只是个普通燕云玩家。',['看看附近频道，也许有有趣的人。','你认识了两个会接梗的玩家。',{social:1,kind:1}],['清日常，留下余力看风景。','你做完任务，带着一身轻松回到大世界。',{practice:1}],{chapters:[1,2]});
add('pre2','群里有人在招固定','有人招觉障林双排，有人招论剑搭子，还有人标注“别来恋爱脑”。',['先问清楚玩什么，不急着贴标签。','你顺利混进一个正常聊天的群。',{social:1,clear:1}],['回一句“本服最强气氛组申请出战”。','有人邀请你充当今晚的吉祥物。',{meme:1,social:1}],{chapters:[1,2]});
add('pre3','断不了情根','群友给你做了一个“断不了情根”鬼畜短片，旁白是“少侠呐少侠”。',['转发：我现在真的断得了。','群友不信，纷纷给你介绍侠缘。',{meme:1,social:1}],['回复：你说得对，我还要打觉。','你暂时把爱情放在聊天框里。',{practice:1}],{chapters:[1,2]});
add('pre4','爱你老己','凌晨，朋友突然感慨：“先爱自己，老己。”有人说刚给网恋对象买了时装。',['笑着说，买东西也得看预算。','你决定绝不靠氪金证明感情。',{guard:1,clear:1}],['说不定真心不贵，先认识人再说。','你给陌生人的好感留了一扇门。',{warm:1}],{chapters:[1,2]});
add('pre5','论剑房里的嘴硬','一次切磋你被打得毫无还手之力，对面发：“你有操作，只是操作不多。”',['回个表情，求对方教教你。','你学到了一个非常实用的小技巧。',{practice:1,kind:1}],['打字：“今天状态不好，明天必拿下。”','你自己也笑了，决定以后少嘴硬。',{meme:1}],{chapters:[1,2]});
add('pre6','梦西洲的深情文学','晚上十一点，群里ID「梦西洲」的大叔又在酒后发忧郁小作文：“夜风吹散侠客梦，谁来接住我的破碎。”不少人怀疑他在借伤感文字吸引年轻女生私聊。',['提醒群友谨慎交友，别把猜测当证据。','你劝大家只讨论文案，不围攻具体玩家。',{dream:1,clear:1,kind:1}],['接梗：“叔，先喝杯热水，文案可以明早发。”','群里笑成一片，他发了一张泡枸杞的图。',{dream:1,meme:1}],{chapters:[1,2],weight:1.35});
add('pre7','群策群力还是群策群骂','有人因为队伍走位失误，被队友做成了九宫格战绩图。',['劝双方先复盘别开盒。','队伍气氛缓和，大家继续排本。',{kind:1,clear:1}],['回复：“起码PPT排版不错。”','当事人也笑了，照片没再传播。',{meme:1}],{chapters:[1,2]});
add('pre8','情缘广告翻车','附近频道一则“找侠缘，包专一”广告，后面竟写了五个联系方式。',['我先围观，别急着相信文案。','你学会看行为，不看海报。',{guard:1}],['问：“这广告是批发的吗？”','旁边玩家刷起问号。',{meme:1,social:1}],{chapters:[1,2]});
add('pre9','师父的第八个徒弟','一个老玩家抱怨自己徒弟太多，连谁喊师父都分不清了。',['建议建个备忘录，别认错人。','群友把你封为江湖行政主管。',{social:1}],['回“这是带娃模拟器吧？”','一排哈哈哈刷过。',{meme:1}],{chapters:[1,2]});
add('pre10','“大睡理论”信徒','朋友给你发了一份“大睡理论”：别为打游戏熬到凌晨三点。',['关掉无意义的通知，早点睡。','你第二天操作明显好了点。',{clear:1}],['继续夜游，但不打扰别人休息。','你在空荡的江湖看了一场日出。',{warm:1}],{chapters:[1,2]});
add('pre11','红绳之谜','缘分桥上有人卖“保证脱单的幸运红绳”，价格比普通材料贵十倍。',['把钱留下来买晚饭。','你成功避开一次玄学消费。',{guard:1}],['假装摆摊：“保证不被绿的红绳！”','路过玩家给你起了个绰号：反诈侠。',{meme:1}],{chapters:[1,2]});
add('pre12','附近频道抽象文学','有人发“如何呢，又能怎”，后面接一句“今晚觉障林还能拿道魁吗”。',['回：“先把队友拉进队再说。”','你成了群里最有行动力的人。',{social:1}],['发一张猫猫持剑表情包。','你的表情包被疯狂收藏。',{meme:1}],{chapters:[1,2]});

 ['p08','双皮奶之争','组队时你想尝试双皮奶阵容，霜刃却说今天不想打这种套路。',['尊重队友意愿，一起换个阵容。','你们发现新阵容很适合彼此。',{bond:2,practice:1}],['发朋友圈说她技术不行才不玩。','她要求你不要拿她当节目效果。',{scandal:2,stress:3}]],
 ['p09','胜利还是告白','夺冠复盘结束，霜刃突然说：“其实我很喜欢跟你一起打。”',['问她是否只指竞技合作，再认真回应。','她承认了自己的心动。',{bond:2,trust:2,confess:1}],['只回“那今晚还能再带我上分吗”。','她说你果然满脑子胜率。',{practice:1,stress:1}]],
 ['p10','刀房礼仪','你们遇到对手在刀房不断挑衅，有人提议赢了之后去截坟。',['按规则打，赢了也保持风度。','霜刃说你是少见不爱争口舌的搭档。',{bond:1,trust:2,practice:1}],['要求全队必须截坟出视频。','小摩擦被放大，开始有人恶意剪辑。',{scandal:3,stress:1}]],
 ['p11','她的直播邀请','一位主播请霜刃上节目，她邀请你临时当搭档，但你有自己的安排。',['坦诚约好时间，不承诺免费长期上分。','她说这样合作才舒服。',{trust:2,bond:1}],['直接辞掉其他事天天为她打。','一周后你累得不行，对她也有怨言。',{spent:1,stress:2,exploited:1}]],
 ['p12','顶着风雪的冠军','霜刃说冲榜最后一天，希望你来场边陪她。',['陪她备赛，也为自己的目标努力。','她赢下关键局，第一时间看向你。',{bond:2,trust:2,practice:1}],['在场边拉横幅：“榜一是我老婆”。','她捂脸笑了，队友刷起“断不了情根”。',{meme:2,bond:1}]]
 ],
 speed:[
 ['r01','零点三秒的执念','折枝第十九次撞到同一块石头，气得说要跟这块石头结侠缘。',['帮她记下节奏点，陪她再试一次。','她成功避开石头，欢呼得像拿了冠军。',{bond:2,trust:1,practice:1}],['给石头取名“情敌一号”。','折枝笑得差点又撞上去。',{meme:2,bond:1}]],
 ['r02','竞速妹没有晚安','折枝半夜两点还在刷路线，说“再一把就睡”已经说了十二次。',['提醒休息，明天继续努力。','她关掉计时器给你发了晚安。',{bond:2,trust:2}],['陪她无休止地刷新，第二天双双起不来。','你们很快乐但也累坏了。',{bond:1,stress:1,practice:1}]],
 ['r03','“带我跑”还是“陪我跑”','折枝问你要不要一起竞速，却不想你单纯站旁边挂机。',['真的练一下她分享的路线。','你第一次追上她半个身位。',{bond:2,practice:1}],['全程挂机夸她“宝宝真厉害”。','她说夸得很好，下次记得动一动。',{meme:1,stress:1}]],
 ['r04','她的录像被抄了','有人直接搬运折枝的路线视频，甚至说成自己的原创。',['帮她整理原视频时间线，礼貌申请标注。','对方补上了来源，她感谢你帮忙。',{trust:2,clear:1}],['带人去评论区围攻，顺便攻击外貌。','争议进一步扩大，她不愿被当流量工具。',{scandal:3,stress:2}]],
 ['r05','竞速还是约会','你们约好一起看游戏里的烟花，折枝却临时发现新捷径。',['说清希望她守约，也可以另定时间。','折枝道歉，关了计时器陪你看完整场烟花。',{bond:2,trust:2}],['生闷气，第二天用沉默惩罚她。','她很困惑，问你为什么不直接说。',{stress:2,jealous:1}]],
 ['r06','神之八秒','折枝打出完美八秒操作，群友剪成“神之八秒”的鬼畜合集。',['替她剪一版有趣且尊重本人的视频。','折枝激动地说要请你喝奶茶。',{bond:2,meme:1}],['私自挂上“我女朋友”的标题炒流量。','她皱眉提醒你们还没确认关系。',{scandal:2,stress:2}]],
 ['r07','排行榜上的陌生ID','折枝的纪录突然被陌生玩家打破。她说对方好厉害，想认识一下。',['鼓励她正常交流，和高手一起练。','她发现你并不把每个异性都当情敌。',{trust:2,clear:1}],['要求她立刻拉黑新高手。','她说你是不是把竞争和恋爱搞混了。',{stress:3,jealous:2}]],
 ['r08','赛道里的情话','折枝突发奇想：“你能不能把‘我喜欢你’说完的时间练成一条新路线？”',['认真陪她设计浪漫竞速彩蛋。','计时器停在你们的专属数字上。',{bond:2,trust:1,flirt:1}],['回复：“我爱你”三个字更省时间。','她大笑：“你是不是也有点竞速脑了？”',{bond:1,meme:2}]],
 ['r09','两份邀请','你约折枝晚饭，她同一时间收到竞速比赛邀请。',['一起协调行程，不逼她二选一。','她主动提前约你，比赛也没耽误。',{bond:2,trust:2}],['说不来约会就当场斩缘。','她认真说不能拿感情当威胁。',{stress:3}]],
 ['r10','零点一秒的秘密','折枝承认自己故意等你一起到终点，因为一个人破纪录没有两个人庆祝开心。',['告诉她不用放水，真正的并肩是各自变强。','她笑着说你才是最想一起冲线的人。',{bond:2,trust:2}],['让她以后比赛都故意输给你。','她皱眉：你是不是太想赢了？',{stress:2}]],
 ['r11','现实竞速挑战','折枝说线下有个跑步活动，问你要不要去为她加油。',['先视频核实身份，按安全约定见面。','她开心地给你发了活动日程。',{verified:1,trust:2}],['不问地点和安全问题就直接出发。','她提醒你先把行程确认清楚。',{unverified:1,stress:1}]],
 ['r12','冠军不应该一个人庆祝','折枝终于破了大纪录，却突然说：“我是不是把你晾在一边太久了？”',['抱抱她，告诉她你愿意并肩但也需要陪伴。','你们约定每周留一晚只属于彼此。',{bond:2,trust:2,lasting:1}],['说她现在才想起自己有对象。','她有点委屈，决定暂时专心练习。',{stress:2}]]
 ]

add('u01','换情头还是换搭子','你发现她跟别人用着一组很像情侣头像的图案，对方说这是大家一起用的系列头像。',['先私聊问清关系，别按头像定罪。','她给你看了群里的整套头像模板。',{trust:2,clear:1}],['立刻在群里挂图说她无缝衔接。','聊天截图扩散，双方都很难堪。',{scandal:3,stress:2,jealous:2}],{chapters:[5,6,7,8]});
add('u02','双人主页没你','她换了新的双人主页搭配，里面没有你。可你们还没有明确是否公开关系。',['先明确期待：主页展示对你意味着什么？','你们发现彼此理解不一样，逐渐找到折中方式。',{trust:2,clear:1}],['直接说“不换我就分手”。','她认为自己被逼着表态。',{stress:3,jealous:2}],{chapters:[6,7,8]});
add('u03','前侠缘的突然出现','她的旧侠缘发来求组队消息，还打了个非常熟悉的昵称。',['坦诚说自己在意，也尊重她交友自由。','她主动介绍彼此认识，气氛变轻松。',{trust:2,clear:1}],['悄悄去翻旧聊天记录，再发群里求审判。','亲友开始站队，事情越来越乱。',{scandal:3,stress:2,jealous:2}],{chapters:[5,6,7,8]});
add('u04','一张截错的图','群里有人说你“吃暧昧票”，证据是一张缺少上下文的私聊截图。',['保存完整记录，私下解释再考虑公开澄清。','误会得到控制，她也帮你澄清。',{trust:2,clear:2}],['怒而发47页PPT对线，不检查个人信息。','事情滚成大瓜，更多人加入围观。',{scandal:4,stress:2,ppt:1}],{chapters:[6,7,8,9]});
add('u05','七夕时装的大套','游戏上新昂贵时装。她说好看，群友却怂恿你：“不买就是不爱！”',['先问她需不需要，不超预算。','她更喜欢你记住的小事，而不是大额礼物。',{trust:2,healthy:1}],['咬牙送出大套，期待她给出感情承诺。','收到礼物她很惊讶，但并没有许诺爱情。',{gift:1,spent:2,stress:1}],{chapters:[6,7,8,9]});
add('u06','送完礼物被已读','你送过礼物后，对方最近回复变慢。你不知道她是忙还是关系淡了。',['问清近况，别把付款当“感情债”。','她解释了最近的生活安排。',{trust:2,clear:1}],['连发十条“礼物钱还我”，并在群里贴付款记录。','她觉得被控制，群友开始围观你们的争执。',{scandal:3,stress:3,spent:1}],{chapters:[7,8,9],need:'gift'});
add('u07','“只是朋友的想念”','她说自己很想念另一个固定队友，你有点吃醋。',['问问边界，允许正常友情存在。','你们把在意和信任说清楚。',{trust:2,clear:1}],['截掉前后语境，发句“懂的都懂”。','群友真的以为出大瓜了。',{scandal:3,stress:2,jealous:1}],{chapters:[5,6,7,8]});
add('u08','师父也进群了','她的师父在群里调侃你们“是不是要结婚”，还催着摆酒。',['开玩笑化解，不把玩笑当承诺。','大家笑着散场，关系没有被绑架。',{bond:1,trust:1}],['当场官宣，连她本人都没问。','她有些尴尬，提醒你先问自己。',{stress:2,scandal:1}],{chapters:[5,6,7,8]});
add('u09','公开还是不公开','有人问你们是不是情侣。你们还没谈过对外怎么称呼彼此。',['私下约定双方都认可的说法。','她觉得你很尊重这段关系。',{trust:2,official:1}],['自己发“已领证”，任由网友二创。','她看到热搜式群聊，一脸问号。',{meme:2,stress:2,scandal:2}],{chapters:[6,7,8,9]});
add('u10','账号双开之谜','群友说看到她两个账号同时在线，有人断定她“脚踏两条船”。',['先听她解释，可能是代清任务。','原来一个号是家人在帮忙，她感谢你没有乱猜。',{trust:2,clear:1}],['把截图放进瓜房，号召大家当侦探。','一场没有证据的猜测很快变成争吵。',{scandal:3,stress:2}],{chapters:[5,6,7,8]});
add('u11','神秘的红包','一名新认识的玩家发来链接，自称点开就送时装券。',['不点陌生链接，提醒她也注意。','你们共同躲过了可疑链接。',{guard:2,trust:1}],['抢着点开，还转发给整群。','安全提示弹出，你赶紧退出页面。',{stress:1,meme:1}],{chapters:[4,5,6,7]});
add('u12','猫猫表情包误会','你发“坏女人”表情包逗她，她却刚好心情不好，误以为你在指责。',['解释本意，并问问她今天怎么了。','你们第一次认真聊起表达方式。',{trust:2,bond:1}],['继续已读乱回，再发十个梗图。','她只回了一个问号。',{stress:2,meme:1}],{chapters:[4,5,6]});
add('u13','“你把我当免费陪玩？”','她连续找你上分，却很少问你的安排。你开始不舒服。',['说清游戏时间和边界。','她意识到自己的疏忽，约好互相照顾。',{trust:2,clear:1}],['忍着不说，心里默默记账。','每多打一局，你都更委屈。',{stress:2,exploited:1}],{chapters:[5,6,7,8]});
add('u14','朋友圈的宿命对视','她给你发了一段“宿命对视”剪辑，把两个人的游戏角色剪成偶像剧。',['回她一段同款视频，认真夸她。','她发来一串笑声：“你也会整活啊。”',{bond:2,meme:1}],['问她是不是拿模板给所有人都发了。','她很奇怪：我只是想分享一个好看的视频。',{stress:2,jealous:1}],{chapters:[4,5,6]});
add('u15','小作文代写服务','梦西洲又在群里发忧郁文案，有人说他需要一位专业情感文案运营。',['一起写“早睡早起、健康生活”劝导版。','群友被逗笑，他最后也发了个早安。',{meme:2,dream:1,bond:1}],['偷偷把他造谣成“全服海王”传出去。','虚构传言引来争吵，你被要求澄清。',{scandal:3,stress:1,dream:1}],{chapters:[4,5,6,7]});
add('u16','瓜房PPT的第48页','群友求你帮忙排版瓜条，里面却有真人ID、手机号和未核实指控。',['拒绝传播隐私，只帮做匿名梗图。','你们把话题变成了“Excel才是恋爱尽头”。',{meme:2,clear:1}],['不看内容直接帮忙转发。','你意识到自己把私人纠纷推成了公审。',{scandal:4,ppt:1,stress:1}],{chapters:[5,6,7,8,9]});
add('u17','陪玩的点单话术','有人自称“免费陪玩”，后来却不断暗示她给自己点单。',['提醒她认清服务与感情边界。','她说你这次真像个成熟搭子。',{trust:2,clear:1}],['也跟着开玩笑问“我的奶茶呢”。','她说你学坏了，发个翻白眼表情。',{meme:1,stress:1}],{chapters:[4,5,6,7]});
add('u18','疑似同款晚安','你看见好几位群友都收过“宝宝早点睡”，有人怀疑是群发模板。',['先别给谁定性，聊聊你真正期待的沟通。','她告诉你，有时候一句专属关心更重要。',{trust:2,bond:1}],['立刻做成“海王晚安群发器”PPT。','有人误以为你在指向现实玩家。',{scandal:2,meme:2,stress:1}],{chapters:[5,6,7,8]});
add('u19','委屈就找康永哥','你和她因打本时间争执。群友模仿“康永哥告状”的口吻说：“她居然让我早点睡！”',['一同调侃，再说清两人的作息。','她笑了：“原来不吵也能解决问题。”',{trust:2,meme:1}],['继续用夸张文案替自己立苦主人设。','她不喜欢被拿来当段子。',{stress:2,scandal:1}],{chapters:[4,5,6,7,8]});
add('u20','照片滤镜开大了','她发来新照片，滤镜让人物像从游戏捏脸界面直接走出。',['夸拍摄氛围，不拿照片代替身份核实。','她说以后奔现会先互相视频。',{trust:2,verified:1}],['说“就凭这张照片我可以坐一夜高铁”。','她提醒你先核实行程，别冲动。',{unverified:1,stress:1}],{chapters:[6,7,8,9]});
add('u21','谁把聊天截屏了','你们私聊的一段土味情话被朋友截去一半发群里。',['先请朋友删除，再向她解释。','她放下心，说私聊就该有边界。',{trust:2,clear:1}],['反手把更多私聊截图发出去比谁更会说。','误会越闹越大，大家开始讨论你们的私生活。',{scandal:4,stress:2}],{chapters:[5,6,7,8,9]});
add('u22','“有主体性”争论','她说：“你不要为了任何人失去自己。”群友却把这句话做成了渣男语录。',['讨论彼此真实需求，不给一句话定罪。','你们定下独处时间和共同时间。',{trust:2,healthy:1}],['认定这是分手暗号，宣布单方面冷战。','她觉得自己被曲解。',{stress:3}],{chapters:[5,6,7,8]});
add('u23','我画地为牢','你给她发了两行小作文：“我画地为牢……”朋友马上接：“那你还不打本？”',['和她一起改写成搞怪情诗。','你们互相念诗笑到半夜。',{meme:2,bond:1}],['让她必须立刻回复八百字。','她笑说写作业都没这么赶。',{stress:1,meme:1}],{chapters:[4,5,6]});
add('u24','交友简历像招聘','有人在群里发“求侠缘岗位JD”：每天上线两小时、月底汇报心动KPI。',['做一张“恋爱不打卡”反向招聘图。','她说你太会玩了。',{meme:2,bond:1}],['认真要求她也交日报和考核表。','她提醒你恋爱不该是上班。',{stress:2}],{chapters:[4,5,6,7]});
add('u25','别人的成功爱情','你看见群友从游戏奔现到结婚的照片，开始怀疑自己进展太慢。',['尊重彼此节奏，不用别人的进度逼她。','她说你愿意慢慢来就好。',{trust:2,bond:1}],['当场订婚礼场地截图发她。','她吓了一跳：咱们还没见面呢！',{stress:2,meme:1}],{chapters:[6,7,8]});
add('u26','皮套与人设','某主播换了新ID和头像，群里有人说他靠“皮套”骗粉。',['只看公开表现，不按网名判断真人。','你和她聊起网络人设与真实边界。',{trust:1,clear:1}],['跟风举报，完全不查证。','群里有人指出证据不完整。',{scandal:2,stress:1}],{chapters:[4,5,6,7]});
add('u27','好友徽章排第几','她把另一个朋友的徽章放在展示栏第一位。你莫名吃味。',['直接问徽章代表什么，别自动对号入座。','原来这是她和公会朋友的纪念。',{trust:2,clear:1}],['要求她现在立刻换成你的。','她感受到压力。',{stress:2,jealous:1}],{chapters:[6,7,8]});
add('u28','戏精群主抢人','群主开玩笑说“今天三个男生七个女生，一人两个”，还想替别人安排侠缘。',['尊重每个人自由选择，跟群主说明白。','她被你的态度打动。',{trust:2,clear:1}],['也跟着点名“给我分三个”。','她问你：“当我是奖励道具？”',{stress:3}],{chapters:[4,5,6,7]});
add('u29','甜蜜的手机屏幕','你们连麦时，她忽然说：“你今天声音有点好听。”',['轻轻回一句“你也是”，然后继续聊天。','短暂的沉默，比土味情话更让人心动。',{bond:2,flirt:1}],['发一张尺度过大的玩笑图。','她提醒你别越过彼此边界。',{stress:2}],{chapters:[4,5,6]});
add('u30','私信中的不明身份','一位陌生人私信称自己是“她的前任”，要你给他发私聊记录。',['拒绝交出私人聊天，向她核实。','你们没有让陌生人挑拨成功。',{trust:2,clear:1}],['立刻把私聊和账号资料全部转给他。','对方转头把内容发群里，局势失控。',{scandal:4,privacy:1,stress:2}],{chapters:[6,7,8,9]});
add('u31','组队频道的“好兄弟”','她用变声器玩梗，故意用低沉男声叫你“老公”。你突然不知道该怎么接。',['笑着问她是不是新学的整活。','她笑得停不下来，还教你变声器参数。',{bond:2,meme:2}],['立刻认定她用假身份骗人。','她收起玩笑，说你想太多。',{stress:2}],{chapters:[4,5,6]});
add('u32','一条送礼备注','你给她寄游戏纪念品，备注里写了“愿与你长久”。她说好甜，但还没收货。',['不把礼物当作要求，问她是否方便收。','她给你发来开心的自拍表情包。',{bond:2,trust:1}],['每天查物流并催她表态。','她说礼物还在路上，你就先急坏了。',{stress:2,gift:1}],{chapters:[5,6,7,8]});

add('cr01','一晚三个晚安','你发现一名队友误把发给你们的相同亲密话术复制到了三个群。她也收到了。',['和她说明误发，确认只是群友玩梗。','你们笑过后约定更清晰地表达关系。',{trust:2,clear:1}],['利用错发当证据，说自己被“三线操作”。','群里瞬间出现了一个“海王调查组”。',{scandal:3,jealous:2,stress:2}],{chapters:[7,8,9],need:'jealous'});
add('cr02','虚假承诺的代价','有人反复暗示你“送聆音大套才会认真谈”，之前的相处却越来越敷衍。你开始意识到这是不健康的互动。',['立即停止送礼，重新确认关系。','你保住预算，发现信任比礼物更重要。',{clear:2,trust:1,gift:0}],['为了最后一次机会再充值。','这次收礼之后，聊天窗口渐渐没有回应。',{giftScam:1,spent:3,stress:2}],{chapters:[8,9],need:'gift'});
add('cr03','主播和免费打手','她忽然要你连着七晚帮忙上分，同时自己忙着在直播间互动，几乎不与你交流。',['提出平等合作和固定休息时间。','双方调整安排后，重新找到了节奏。',{trust:2,clear:1}],['放弃全部日常，默默替她打完。','你成了免费的上分机器，却失去原本的快乐。',{exploited:2,spent:2,stress:2}],{chapters:[7,8,9],need:'exploited'});
add('cr04','截图在群里疯传','你们的聊天被截取一小段，群友据此脑补出完全不同的恋情。你们都收到了陌生人的私信。',['只保存必要证据，要求停止传播并向平台举报。','有人删除了错误内容，局势慢慢平息。',{clear:2,trust:1}],['公开更多私密消息“以毒攻毒”。','聊天记录越传越远，最后你也成了瓜房素材。',{scandal:4,privacy:1,stress:2}],{chapters:[8,9],need:'scandal'});
add('cr05','斩缘后遇见旧人','你们有过争执，又在觉障林排到了她曾经的固定队友。群友忽然开起旧情玩笑。',['拒绝鞭尸，赛后私下把误会说清。','你们没有让队伍摩擦变成人身攻击。',{clear:2,trust:1}],['故意挑衅并截图群发。','矛盾持续扩大，群聊成了审判现场。',{scandal:4,stress:3}],{chapters:[8,9],need:'stress'});
add('cr06','她提出暂时冷静','争执之后，她说希望各自冷静一天，不想继续高强度争吵。',['尊重边界，约定明天认真谈。','她愿意回来把事情说清楚。',{trust:2,clear:1,stress:-1}],['拉所有共同好友给她打电话施压。','她明确要求停止联系，你们关系走向破裂。',{breakup:1,scandal:3,stress:3}],{chapters:[8,9],need:'stress'});

function doChoice(i){if(!game||!currentEvent||!currentEvent.choices[i])return;const c=currentEvent.choices[i],g=game;

function resolveEnding(){const f=game.flags,g=game;let id='E37';const n=()=>Math.random();

 else if(f.guafang||g.scandal>=7)id=f.ppt?'E35':g.scandal>9?'E24':'E11';
 else if(f.privacy&&g.scandal>=4)id='E15';
 else if(f.giftScam)id='E12';
 else if(f.breakup||g.stress>=5){if(f.spent>=3)id=n()<.5?'E16':'E23';else if(f.avatarSwap)id=n()<.5?'E14':'E17';else if(f.exploited)id='E22';else if(f.jealous>=2)id='E21';else id=n()<.4?'E18':'E19'}
 else if(f.friendOnly||!f.serious){if(f.mediator)id='E31';else if(f.socialLegend)id='E29';else if(f.mentor)id='E32';else if(f.practice>=3&&f.careerTry)id='E30';else if(g.career==='论剑玩家'||(f.careerPvp&&n()<.06))id='E25';else if(g.career==='竞速玩家'||(f.careerSpeed&&n()<.06))id='E26';else if(g.career==='觉障林主播'||(f.careerStream&&n()<.06))id='E27';else if(g.career==='陪玩')id='E28';else if(f.dream>=1&&f.meme>=2&&n()<.26)id='E38';else if(f.ppt)id='E34';else if(f.meme>=5)id='E36';else if(g.bond>=7&&g.stress<=2)id='E10';else id='E37'}
 else if(f.meetInPerson&&g.trust>=3){if(f.retired)id='E08';else if(f.coupleStream&&f.lasting)id='E07';else if(f.happy&&g.bond>=7)id=n()<.12?'E02':g.hero.id==='pvp'?'E06':g.hero.id==='speed'?'E04':'E01';else id='E10'}
 else if(f.verified&&f.lasting)id=f.coupleStream?'E07':f.retired?'E08':n()<.28?'E09':'E03';
 else if(f.lasting&&g.bond>=9&&g.stress<=2)id=f.coupleStream?'E07':n()<.20?'E05':'E03';
 else if(g.stress>=3&&g.trust<3)id=f.spent?'E23':'E19';
 else if(g.scandal>=4)id='E11';
 else if(g.trust>=3&&g.bond>=6)id=n()<.2?'E05':'E10';
 else id=n()<.35?'E19':'E10';
 return endings.find(e=>e.id===id)||endings[36];

function extraChoicesFor(ev){
 const choices=authoredExtras[ev.id];
 if(choices)return choices.map(c=>({...c,delta:{...c.delta}}));
 // Covers future/generated scenes without ever clipping existing authored options.
 return [opt(`先把「${ev.title}」里自己的顾虑说清楚。`,'你没有立即表态，先把真正介意的事情讲了出来。',{trust:1,clear:1}),opt('承认今晚没有余力，约个时间再认真回应。','事情暂时搁置，你也接受这次退后可能让关系慢下来。',{stress:-1,bond:-1})];
}
function prepareEventChoices(ev){
 const prepared={...ev,choices:ev.choices.map(c=>({...c,delta:{...c.delta}}))};
 for(const c of extraChoicesFor(ev)){if(prepared.choices.length>=4)break;if(!prepared.choices.some(x=>x.text===c.text))prepared.choices.push(c)}
 while(prepared.choices.length<4)prepared.choices.push(opt('说明自己还没想好，暂时保留判断。','你没有给出答案，关系也暂时停在原地。',{bond:-1}));
 // A single roll per encounter; showTurn only renders this prepared array.
 if(prepared.choices.length===4 && Math.random()<.32){
  let group=game.turn<=2?'pre':ev.id.startsWith('endBad')||ev.id.startsWith('endRisk')||ev.id.startsWith('cr')?'crisis':ev.id.startsWith('meet0')?'meet':ev.arc||game.hero.id;
  const pool=hiddenPools[group]||hiddenPools.social;
  const unseen=pool.filter((_,i)=>!game.hiddenSeen?.[`${group}-${i}`]);
  const source=unseen.length?unseen:pool;
  const item=randomOne(source),key=`${group}-${pool.indexOf(item)}`;
  game.hiddenSeen=game.hiddenSeen||{};game.hiddenSeen[key]=true;
  let delta={...item[2]};
  // Comic detours cannot bypass the established final crisis.
  if(ev.id.startsWith('endBad'))delta.breakup=1;

  if(ev.id.startsWith('endSolo'))delta.friendOnly=1;
  prepared.choices.push({...opt(item[0],item[1],delta),hidden:true});
 }
