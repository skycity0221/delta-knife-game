const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function showSetup(){screen='setup';setup.path='newbie';setup.temperament='rational';el(hdr()+`<section class="panel start-panel"><button class="back" onclick="showHome()">← 返回首页</button><div class="eyebrow">CHAPTER 00 · 普通玩家的故事</div><h1 class="section-title">今晚，上线吗？</h1><p class="muted">你只是一个普通的燕云玩家。可能收获一段爱情，也可能突然走上另一条江湖路。</p><label class="tiny" for="playerName">给自己取个昵称</label><div class="formline"><input id="playerName" maxlength="12" value="${esc(setup.name)}" placeholder="输入昵称" autocomplete="off"></div><div class="starter-note">♥ 10个回合，一段意想不到的江湖人生。职业、情缘与结局，都留给命运和你的选择。</div><button class="btn start-full" onclick="startGame()">❤ 开始第 ${save.runs+1} 段人生</button></section>`+footer())}
function rand(max){return Math.floor(Math.random()*max)}function adjust(delta){for(const [k,v] of Object.entries(delta||{})){if(k in game.stats)game.stats[k]=Math.max(k==='money'?0:0,Math.min(k==='money'?200:100,game.stats[k]+v))}}
function startGame(){setup.name=(document.getElementById('playerName')?.value||'少侠').trim().slice(0,12)||'少侠';setup.path='newbie';setup.temperament='rational';const st={...defaultStats};game={name:setup.name,origin:'newbie',temperament:'rational',role:'普通玩家',stats:st,turn:1,flags:{},visited:{},log:[],npc:namedNPCs[rand(namedNPCs.length)],eventsCompleted:0};screen='game';chooseEvent()}
function weightedPick(pool){let total=pool.reduce((x,e)=>x+e.weight,0),r=Math.random()*total;for(const e of pool){r-=e.weight;if(r<=0)return e}return pool[pool.length-1]}
const rareEventIds=new Set(['opportunity_rank','opportunity_speed','opportunity_stream','opportunity_escort','opportunity_forest','opportunity_player']);
const mandatoryFollowups=new Set(['meet_result','reality','guafang','new_avatar']);
function eligibleEvent(e){return e.condition({...game.stats,flags:game.flags,turn:game.turn});}
function chooseEvent(){
 if(!game)return;
 if(game.turn>10){finishGame();return;}
 let pool=events.filter(e=>!game.visited[e.id]&&eligibleEvent(e));
 if(!pool.length)pool=events.filter(eligibleEvent);
 // 连锁剧情优先，但并非每次都强制：为事件留出合理的时间间隔。
 let follow=pool.filter(e=>mandatoryFollowups.has(e.id));
 const romanceChain=new Set(['nightduo','voice','friend','confess','official','past_lover','verify','meet','misunderstanding','breakup']);
 const romance=pool.filter(e=>romanceChain.has(e.id));
 if(follow.length&&Math.random()<.86){currentEvent=weightedPick(follow);}
 else if(game.flags.met&&romance.length&&Math.random()<.60){currentEvent=weightedPick(romance);}
 else{
   const normal=pool.filter(e=>!rareEventIds.has(e.id)&&!mandatoryFollowups.has(e.id));
   const rare=pool.filter(e=>rareEventIds.has(e.id));
   const hasCareer=game.role!=='普通玩家';
   const pickRare=!hasCareer&&rare.length&&Math.random()<.075;
   currentEvent=weightedPick(pickRare?rare:(normal.length?normal:pool));
 }
 game.visited[currentEvent.id]=(game.visited[currentEvent.id]||0)+1;showTurn();
}
function statPanel(){const cols=[['skill','剑术'],['speed','竞速'],['charm','魅力'],['eq','情商'],['money','财力'],['fame','名气'],['romance','恋爱脑'],['guard','警惕心']];return `<div class="stats">${cols.map(([k,n])=>`<div class="stat"><div class="stat-top"><span>${n}</span><b>${Math.round(game.stats[k])}</b></div><div class="track"><span style="width:${Math.min(100,game.stats[k])}%"></span></div></div>`).join('')}</div>`}
function showTurn(){if(!game)return;screen='game';const ev=currentEvent;const all=ev.choices;const choices=all.length<=2?all:all.slice(0,2);game.offeredChoices=choices;el(hdr()+`<section class="panel story-panel"><div class="flex"><div class="hud"><span class="pill">第 ${game.turn} / 10 回合</span><span class="pill">${esc(game.role)}</span></div><button class="navbtn quit" onclick="confirmQuit()">结束本局</button></div><div class="progress"><span style="width:${game.turn/10*100}%"></span></div><div class="scene"><div class="chapter">CHAPTER ${String(game.turn).padStart(2,'0')} · 江湖偶遇</div><h2>${esc(ev.title)}</h2><p>${esc(ev.body.replaceAll('{npc}',game.npc.name))}</p></div><div class="scene-question">此刻，你会……</div><div class="story-choices">${choices.map((c,i)=>`<button class="choice" onclick="doChoice(${i})"><span><b>${'AB'[i]}.</b> ${esc(c.text)}</span><span class="arrow">›</span></button>`).join('')}</div></section>`+footer())}
function tryCareerShift(ev,c){
 if(game.role!=='普通玩家')return '';
 const roles={opportunity_rank:['rank','论剑玩家'],opportunity_speed:['speed','竞速玩家'],opportunity_stream:['stream','主播'],opportunity_escort:['escort','陪玩'],opportunity_forest:['forest','觉障林高手'],opportunity_player:['player','海王']};
 const target=roles[ev.id];if(!target||c.flag!==target[0])return '';
 if(Math.random()>=.3)return '';
 game.role=target[1];game.flags.careerShift=true;game.flags.careerRole=target[0];
 return `江湖机缘！你开始踏上「${target[1]}」之路。`;
}
function doChoice(i){
 if(!game||!currentEvent||!game.offeredChoices?.[i])return;
 const ev=currentEvent,c=game.offeredChoices[i];
 adjust(c.delta);
 if(c.flag)game.flags[c.flag]=true;
 if(c.set)Object.assign(game.flags,c.set);
 // 连锁状态只从明确的玩家选择产生，避免凭空结缘、奔现和被骗。
 if(c.flag==='metInPerson')game.flags.meetResolved=true;
 if(c.flag==='meetDisappointed')game.flags.meetResolved=true;
 if(c.flag==='giftScam')game.flags.gift=true;
 if(c.flag==='player')game.flags.flirtingMultiple=true;
 const shift=tryCareerShift(ev,c);
 game.log.push({turn:game.turn,event:ev.id,choice:c.text,result:c.result});
 game.eventsCompleted++;game.turn++;
 if(shift)toast(shift);
 chooseEvent();
}

function resolveEnding(){
 const f=game.flags,s=game.stats;
 const hasRelationship=!!f.serious;
 const hasMet=!!f.metInPerson;
 let id;
 // 结局必须有事件因果，不允许“没遇到人就结婚”“没练技术就榜一”。
 if(f.privacyRisk&&(s.scandal>=20||f.ppt))id='E15';
 else if(f.giftScam)id='E12';
 else if(f.avatarDrama)id='E14';
 else if(f.ppt)id='E11';
 else if(f.publicFight&&!f.clarified)id='E24';
 else if(f.meetDisappointed)id=(f.unverified&&s.guard<35)?'E13':'E20';
 else if(f.breakup)id='E19';
 else if(f.lasting&&hasMet&&hasRelationship)id=s.eq>=57?'E09':'E03';
 else if(hasMet&&hasRelationship)id=f.verified?'E01':'E04';
 else if(hasRelationship&&f.official)id='E05';
 else if(hasRelationship&&s.affection>=61)id='E10';
 else if(f.flirtingMultiple&&s.scandal>=18)id='E21';
 else if(f.gift&&s.money<25)id='E23';
 else if(game.role==='论剑玩家'&&s.skill>=45)id='E25';
 else if(game.role==='竞速玩家'&&s.speed>=38)id='E26';
 else if(game.role==='主播'&&s.fame>=27)id='E27';
 else if(game.role==='陪玩')id='E28';
 else if(game.role==='觉障林高手')id='E30';
 else if(game.role==='海王')id='E21';
 else if(f.dreamMeme&&s.charm>=30)id='E38';
 else if(f.dreamResolved&&s.eq>=34)id='E38';
 else if(f.mediator&&s.eq>=56&&s.fame>=20)id='E31';
 else if(f.speedPractice&&s.speed>=32)id='E26';
 else if(f.practice&&s.skill>=47)id='E30';
 else if(f.forestPlayed&&s.skill>=43)id='E36';
 else if(f.met&&s.affection>=24)id='E10';
 else if((f.dreamCalled||f.dreamCalm)&&f.dreamMeme)id='E38';
 else if(f.socialized&&s.fame>=24)id='E29';
 else id='E37';
 return endings.find(x=>x.id===id)||endings[29];
}
function finishGame(){if(!game)return;lastEnding=resolveEnding();save.runs++;save.seen[lastEnding.id]=(save.seen[lastEnding.id]||0)+1;save.cgs[lastEnding.cg]=true;const record={name:game.name,ending:lastEnding.id,turns:game.eventsCompleted,date:new Date().toLocaleString('zh-CN'),stats:{...game.stats}};save.history.unshift(record);save.history=save.history.slice(0,20);persist();const shouldAd=save.runs%5===0;game=null;showEnding(lastEnding,shouldAd)}

function startGame(){setup.name=(document.getElementById('playerName')?.value||'少侠').trim().slice(0,12)||'少侠';const hero=rr(heroines);game={name:setup.name,origin:'newbie',temperament:'rational',role:'普通玩家',stats:{...defaultStats},turn:1,flags:{},visited:{},log:[],hero,npc:hero,eventsCompleted:0,bond:0,trust:0,dream:Math.random()<.4,career:null};screen='game';chooseEvent()}
function chooseEvent(){if(!game)return;if(game.turn>10){finishGame();return}currentEvent=stageEvent();game.offeredChoices=currentEvent.choices;showTurn()}
function showTurn(){if(!game)return;screen='game';const ev=currentEvent,h=game.hero;const showHero=game.turn>=3;el(hdr()+`<section class="panel story-panel"><div class="flex"><div class="hud"><span class="pill">第 ${game.turn} / 10 回合</span><span class="pill">${showHero?`${h.emoji} ${esc(h.name)} · ${esc(h.label)}`:'普通玩家'}</span></div><button class="navbtn quit" onclick="confirmQuit()">结束本局</button></div><div class="progress"><span style="width:${game.turn/10*100}%"></span></div><div class="scene"><div class="chapter">CHAPTER ${String(game.turn).padStart(2,'0')} · ${showHero?'心动江湖':'缘分将至'}</div><h2>${esc(ev.title)}</h2><p style="white-space:pre-line">${esc(ev.body)}</p></div><div class="scene-question">这一刻，你会……</div><div class="story-choices">${ev.choices.map((c,i)=>`<button class="choice" onclick="doChoice(${i})"><span><b>${'AB'[i]}.</b> ${esc(c.text)}</span><span class="arrow">›</span></button>`).join('')}</div><p class="tiny" style="text-align:center;margin-top:17px">你的选择会被故事记住 · 不显示属性变化</p></section>`+footer())}
function doChoice(i){if(!game||!currentEvent||!currentEvent.choices[i])return;const c=currentEvent.choices[i],g=game;for(const [k,v] of Object.entries(c.changes||{})){if(k==='bond'||k==='trust')g[k]+=v;else g.flags[k]=v}g.log.push({turn:g.turn,event:currentEvent.id,choice:c.text,result:c.result});g.eventsCompleted++;g.turn++;
 if(g.turn===9&&g.flags.friendOnly&&g.flags.careerTry&&Math.random()<.12){g.career=rr(['论剑玩家','竞速玩家','觉障林主播','陪玩']);g.role=g.career;}
 chooseEvent()}
function resolveEnding(){const f=game.flags,g=game;let id='E37';if(f.catfish){id='E13'}else if(f.breakup){id=f.spent?'E23':'E19'}else if(f.friendOnly){if(g.career==='论剑玩家')id='E25';else if(g.career==='竞速玩家')id='E26';else if(g.career==='觉障林主播')id='E27';else if(g.career==='陪玩')id='E28';else id='E37'}else if(f.meetInPerson&&f.lasting){id=f.happy?(g.hero.id==='pvp'?'E06':g.hero.id==='speed'?'E04':'E01'):'E10'}else if(f.serious&&f.lasting){id=f.happy?'E03':'E10'}else if(f.serious){id=f.gift&&g.bond<5?'E23':'E10'}else if(f.ambiguous&&f.solo){id='E19'}else if(f.lasting){id='E10'}else if(f.solo){id='E37'}else if(f.dreamMeme&&g.bond<4){id='E38'}else{id='E19'}return endings.find(e=>e.id===id)||endings[36]}
// 结局只按已发生情节判定；未发生的照骗、婚礼、瓜房不凭空出现。
function hdr(){return `<div class="top"><div class="brand"><span class="brandmark">缘</span>恋与燕云 <span class="tiny">SIMULATOR 1.3</span></div><div class="topright"><span class="tiny">已通关 ${save.runs} 局</span><button class="navbtn" onclick="showHome()">⌂ 首页</button></div></div>`}
function showAbout(){screen='about';el(hdr()+`<section class="panel"><button class="back" onclick="showHome()">← 返回首页</button><h1 class="section-title">版本 V1.3 · 恋爱剧情重构</h1><p>每局10回合，第3回合必定遇见一位女主，后续剧情以关系推进为核心。不同女主有不同相遇和相处场景。</p><p>保留结局与CG图鉴、本地记录、每通关5局一次争锋工作室推广。全部主角均为虚构成年人；“女大学生徒弟”也设定为成年人。</p><button class="btn secondary small" onclick="showAd()">查看争锋工作室推广</button></section>`+footer())}
